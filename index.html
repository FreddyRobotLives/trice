<style>
*{box-sizing:border-box}
:root{
  --ink:#17181a; --body:#403d37; --muted:#86837b; --faint:#a8a49a; --label:#98948a;
  --accent:#c8452c; --bg:#f3f1ec; --card:#fff; --line:#e7e4dc; --soft:#f7f5f0; --hair:#efece5;
  --good:#2f7d55; --good-bg:#eaf3ec; --info:#2f5573; --info-bg:#ebf0f2;
  --warn:#b8842a; --warn-ink:#8a6118; --warn-bg:#f7f0dd; --bad:#b34b48; --bad-bg:#faeeec;
}
html,body{height:100%}
html{-webkit-text-size-adjust:100%;text-size-adjust:100%}
body{margin:0;background:var(--bg);color:var(--ink);font-family:"Helvetica Neue",Helvetica,Arial,sans-serif;-webkit-font-smoothing:antialiased;line-height:1.5;font-size:14px;overscroll-behavior-y:contain}
::selection{background:rgba(200,69,44,.16)}
a{color:var(--info);text-decoration:none}
input,select,button,textarea{font-family:inherit;font-size:16px}
button{font-size:14px}
*{-webkit-tap-highlight-color:transparent}
button,label,a,.chip{touch-action:manipulation}
.nav button,.chip,.shutter,.hazbtn{-webkit-user-select:none;user-select:none}
input:focus,select:focus,textarea:focus{outline:none;border-color:var(--ink)}
::placeholder{color:var(--faint)}
button{cursor:pointer}
.mono{font-family:ui-monospace,"SF Mono",Menlo,monospace}
@keyframes fadeUp{from{opacity:0;transform:translateY(10px) scale(.97)}to{opacity:1;transform:translateY(0) scale(1)}}
@keyframes adpulse{0%,100%{opacity:.2}50%{opacity:1}}
@keyframes sheetup{from{transform:translateY(30px);opacity:0}to{transform:translateY(0);opacity:1}}
@keyframes spin{to{transform:rotate(360deg)}}
@media (prefers-reduced-motion:reduce){*{animation-duration:.01ms !important;transition-duration:.01ms !important}}

body{overflow-x:hidden}
#app{max-width:520px;margin:0 auto;overflow-x:hidden;min-width:0;min-height:100vh;min-height:100dvh;display:flex;flex-direction:column;background:var(--bg)}
@media(min-width:560px){#app{border-left:1px solid var(--line);border-right:1px solid var(--line)}}

.hdr{flex:none;position:sticky;top:0;z-index:30;background:rgba(243,241,236,.92);backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);border-bottom:1px solid var(--line);padding:calc(env(safe-area-inset-top,0px) + 12px) 18px 12px;display:flex;align-items:center;gap:11px}
.logo{width:34px;height:34px;border-radius:9px;flex:none;background:var(--accent);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3.5px}
.logo span{height:2.5px;background:#fff;border-radius:1px;display:block}
.logo span:nth-child(1){width:9px}.logo span:nth-child(2){width:13px}.logo span:nth-child(3){width:17px}
.hdr .t1{font-size:16px;font-weight:700;letter-spacing:.06em;line-height:1.15}
.hdr .t2{font-size:11px;color:var(--muted)}
.hdr .site{margin-left:auto;text-align:right;min-width:0}
.hdr .site .s1{font-size:12px;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:160px}
.hdr .site .s2{font-size:10.5px;color:var(--muted)}

.view{flex:1;min-height:0;overflow-y:auto;padding:16px 16px calc(env(safe-area-inset-bottom,0px) + 86px);-webkit-overflow-scrolling:touch}
.view::-webkit-scrollbar{width:0}
.slab{font-size:10.5px;letter-spacing:.11em;text-transform:uppercase;color:var(--label);font-weight:700}
.card{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:15px;min-width:0;overflow-wrap:break-word}
.slab{overflow-wrap:anywhere}
.sheet{overflow-wrap:break-word}
.chip{font-size:10.5px;font-weight:700;border-radius:999px;padding:4px 11px;display:inline-block;white-space:nowrap}
.chip.good{color:var(--good);background:var(--good-bg)}
.chip.warn{color:var(--warn-ink);background:var(--warn-bg)}
.chip.bad{color:var(--bad);background:var(--bad-bg)}
.chip.info{color:var(--info);background:var(--info-bg)}
.btn{border:0;border-radius:13px;padding:13px;font-size:14px;font-weight:600;letter-spacing:.01em;width:100%;display:flex;align-items:center;justify-content:center;gap:8px;transition:opacity .15s,transform .06s}
.btn:active{transform:scale(.985)}
.btn.primary{background:var(--accent);color:#fff}
.btn.dark{background:var(--ink);color:#fff}
.btn.ghost{background:#fff;border:1px solid var(--line);color:var(--ink)}
.btn:disabled{opacity:.5;cursor:default}
.field label{display:block;font-size:11px;letter-spacing:.09em;text-transform:uppercase;color:var(--label);font-weight:600;margin-bottom:6px}
.field input,.field textarea,.field select{width:100%;border:1px solid var(--line);border-radius:12px;padding:11px 13px;background:#fff;color:var(--ink)}
.field textarea{resize:vertical;min-height:64px}
.stat3{display:grid;grid-template-columns:1fr 1fr 1fr;gap:8px}
.stat3 .cell{background:var(--soft);border-radius:10px;padding:9px 10px}
.stat3 .k{font-size:10.5px;color:var(--muted)}
.stat3 .v{font-size:13px;font-weight:700;overflow-wrap:anywhere}
.dot{width:5px;height:5px;border-radius:50%;flex:none;margin-top:6px}
.spinner{width:16px;height:16px;border:2px solid rgba(255,255,255,.35);border-top-color:#fff;border-radius:50%;animation:spin .7s linear infinite;flex:none}
.spinner.ink{border-color:#dcd8ce;border-top-color:var(--ink)}

.nav{position:fixed;bottom:0;left:0;right:0;margin:0 auto;width:100%;max-width:520px;z-index:40;background:rgba(255,255,255,.96);backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);border-top:1px solid var(--line);display:flex;padding:6px 8px calc(env(safe-area-inset-bottom,0px) + 6px)}
.nav button{flex:1;border:0;background:none;padding:7px 2px;display:flex;flex-direction:column;align-items:center;gap:4px;color:var(--faint);font-size:10.5px;font-weight:600;transition:color .15s}
.nav button.on{color:var(--ink)}
.nav .ic{width:22px;height:22px;display:block}
.nav .ic path,.nav .ic circle,.nav .ic rect{stroke:currentColor;fill:none;stroke-width:1.7;stroke-linecap:round;stroke-linejoin:round}
.nav button.on .ic path,.nav button.on .ic circle,.nav button.on .ic rect{stroke:var(--accent)}

/* Live camera */
.cam{position:fixed;inset:0;z-index:90;background:#000;display:flex;flex-direction:column}
.cam video{flex:1;min-height:0;width:100%;object-fit:cover;background:#000}
.cam .ct{position:absolute;top:0;left:0;right:0;padding:calc(env(safe-area-inset-top,0px) + 16px) 18px 40px;display:flex;justify-content:space-between;align-items:flex-start;background:linear-gradient(rgba(0,0,0,.55),transparent);color:#fff;z-index:2}
.cam .cb{position:absolute;bottom:0;left:0;right:0;padding:26px 18px calc(env(safe-area-inset-bottom,0px) + 28px);display:flex;align-items:center;justify-content:center;background:linear-gradient(transparent,rgba(0,0,0,.55));z-index:2}
.shutter{width:74px;height:74px;border-radius:50%;border:4px solid #fff;background:rgba(255,255,255,.25);display:flex;align-items:center;justify-content:center;padding:0}
.shutter span{width:56px;height:56px;border-radius:50%;background:#fff;display:block;transition:transform .1s}
.shutter:active span{transform:scale(.86)}
.camchip{background:rgba(11,14,18,.6);border-radius:999px;padding:6px 12px;font-size:11.5px;font-weight:600;display:inline-flex;align-items:center;gap:7px}
.camchip .liv{width:6px;height:6px;border-radius:50%;background:#7ee2a8;animation:adpulse 1.6s infinite}

/* Map */
#mapWrap{position:relative;border-radius:16px;overflow:hidden;border:1px solid var(--line);background:#e3e0d8}
#map{height:62vh;height:62dvh;min-height:380px;width:100%}
.mapctl{position:absolute;top:12px;right:12px;z-index:500;display:flex;flex-direction:column;gap:8px}
.mapctl button{border:0;border-radius:10px;background:rgba(255,255,255,.95);box-shadow:0 4px 14px -6px rgba(8,12,18,.4);font-size:11.5px;font-weight:700;padding:8px 12px;color:var(--ink)}
.mapctl button.on{background:var(--ink);color:#fff}
.pin2{position:relative;border-radius:50%;border:2.5px solid #fff;box-shadow:0 1px 4px rgba(8,12,18,.6),0 4px 14px rgba(8,12,18,.3);display:flex;align-items:center;justify-content:center;color:#fff;font-weight:800;line-height:1;font-family:"Helvetica Neue",Helvetica,Arial,sans-serif}
.pin2 .qty{position:absolute;right:-7px;top:-7px;min-width:17px;height:17px;border-radius:999px;background:#16181d;color:#fff;font-size:9.5px;font-weight:700;display:flex;align-items:center;justify-content:center;padding:0 4px;border:2px solid #fff}
.leaflet-popup-content-wrapper{border-radius:12px;box-shadow:0 10px 30px -14px rgba(8,12,18,.4)}
.leaflet-popup-content{margin:12px 14px;font-family:"Helvetica Neue",Helvetica,Arial,sans-serif;font-size:12.5px;line-height:1.45}

/* rows */
.trow{display:flex;gap:11px;align-items:center;padding:12px 0;border-top:1px solid var(--hair);width:100%;background:none;border-left:0;border-right:0;border-bottom:0;text-align:left;color:var(--ink)}
.trow:first-child{border-top:0}
.trow{border-top:1px solid var(--hair)}
.trow .thumb{width:46px;height:46px;border-radius:12px;object-fit:cover;flex:none;background:#ecebe4}
.trow .mid{flex:1;min-width:0}
.trow .l1{display:block;font-size:13.5px;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.trow .l2{display:block;font-size:11.5px;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.trow:disabled{opacity:1}
.trow:disabled .l1,.trow:disabled .l2{color:#c2beb3}
.trow .hs{font-size:16px;font-weight:700;flex:none;text-align:right;min-width:32px}

/* Photo zoom overlay */
.zoom{position:fixed;inset:0;z-index:80;background:#0b0e12;display:flex;flex-direction:column}
.zoom .zt{flex:none;padding:calc(env(safe-area-inset-top,0px) + 18px) 18px 12px;display:flex;justify-content:space-between;align-items:center;color:#fff;gap:12px}
.zoom img{flex:1;min-height:0;width:100%;object-fit:contain}
.zoom .zb{flex:none;padding:12px 18px calc(env(safe-area-inset-bottom,0px) + 20px);color:#fff}
.backmap{border:0;border-radius:999px;background:rgba(255,255,255,.14);color:#fff;font-size:12.5px;font-weight:700;padding:9px 16px;display:inline-flex;align-items:center;gap:7px;backdrop-filter:blur(6px)}

.sheet-scrim{position:fixed;inset:0;z-index:60;background:rgba(11,14,18,.45)}
.sheet{position:fixed;left:0;right:0;margin:0 auto;bottom:0;width:100%;max-width:520px;z-index:61;background:#fff;border-radius:20px 20px 0 0;padding:18px 18px calc(env(safe-area-inset-bottom,0px) + 20px);animation:sheetup .28s ease both;max-height:88vh;max-height:88dvh;overflow-y:auto}
#adjMap{height:300px;border-radius:14px;overflow:hidden;border:1px solid var(--line)}

.toast{position:fixed;left:0;right:0;margin:0 auto;width:fit-content;bottom:calc(env(safe-area-inset-bottom,0px) + 96px);z-index:95;background:var(--ink);color:#fff;font-size:12.5px;font-weight:600;border-radius:999px;padding:9px 16px;max-width:88vw;text-align:center;animation:fadeUp .25s ease both}

.ruler{position:fixed;inset:0;z-index:85;background:#0b0e12;display:flex;flex-direction:column;touch-action:none}
.ruler .rimg{flex:1;min-height:0;position:relative;overflow:hidden}
.ruler img{position:absolute;inset:0;width:100%;height:100%;object-fit:contain;pointer-events:none}
.rline{position:absolute;left:0;right:0;height:0;border-top:2px dashed #fff;pointer-events:none}
.rgrab{position:absolute;left:50%;transform:translate(-50%,-50%);width:64px;height:44px;border-radius:999px;background:rgba(200,69,44,.92);color:#fff;display:flex;align-items:center;justify-content:center;font-size:11px;font-weight:700;box-shadow:0 4px 14px rgba(0,0,0,.4)}
#printReport{display:none}
@media print{
  body{background:#fff}
  #app,.nav,.zoom,.sheet,.sheet-scrim,.toast,.cam{display:none !important}
  #printReport{display:block;font-family:"Helvetica Neue",Helvetica,Arial,sans-serif;color:#16181d;padding:0;font-size:12px;line-height:1.5;-webkit-print-color-adjust:exact;print-color-adjust:exact}
  #printReport .ptree{page-break-inside:avoid;border:1px solid #ddd;border-radius:10px;padding:14px;margin-top:12px;display:flex;gap:14px}
  #printReport .ptree img{width:150px;height:150px;object-fit:cover;border-radius:8px;flex:none}
  #printReport table{width:100%;border-collapse:collapse;margin-top:10px}
  #printReport th,#printReport td{text-align:left;padding:6px 8px;border-bottom:1px solid #e5e5e5;font-size:11px;vertical-align:top}
  #printReport th{font-size:10px;text-transform:uppercase;letter-spacing:.08em;color:#777}
}
</style>

<body>
<div id="app"></div>
<div id="printReport"></div>
<script>
'use strict';
/* ============================================================
   Trice × WTR — Field & Consulting App (tree module) v10
   v10: the AI key lives ONLY in the host environment (server side);
   all AI calls stream through /api/analyze. Color coding removed. XLSX fixed.
   Built to the V5 Field Data Collection Specification (11 Aug 2026)
   and the WTR operating summary. Capture stays rapid: three
   hazard buttons, four failure types, auto GPS+timestamp,
   voice notes. The map is the task list — Cleared flips it green.
   ============================================================ */

/* ---------------- V5 vocabulary ---------------- */
const HAZARDS = ['High Hazard', 'Moderate', 'Cleared'];
const HAZ_INK = h => h === 'High Hazard' ? '#b34b48' : (h === 'Moderate' ? '#b8842a' : '#2f7d55');
const HAZ_TONE = h => h === 'High Hazard' ? 'bad' : (h === 'Moderate' ? 'warn' : 'good');
const CAUSES = ['Windthrow','Trunk Shear','Torsion','Windthrow / Trunk Shear','Root Plate Failure','Limb Failure / Hanger','Crown Loss','Lightning Strike','Flood / Saturation','Storm Surge / Salt Intrusion','Decay / Structural Defect','Pest / Disease','Pre-Existing — Not Event Related','Undetermined'];
const FAILURES = ['Canopy Torsion','Root Plate Shear','Branch Hanger','Trunk Shear'];
const DISPOSALS = ['','On-site Chipper','Haul-off','On-site Mulch / Stockpile','On-site Burn (where permitted)','Client Disposal','Log Salvage / Milling','Leave in Place','Not Applicable'];
const STUMPS = ['','Grind below grade','Grind 12 in below grade','Grind 6 in below grade','Flush cut','Full excavation','Leave in place','Not Applicable'];
const ASSESS_TYPES = ['Routine Canopy Inventory','Pre-Loss Inspection','Post-Loss Assessment','Storm Response','Pre-Acquisition Inspection','Forensic Claim Audit'];
const DBH_BAND = d => { d = parseFloat(d); if (!isFinite(d) || d <= 0) return ''; if (d < 6) return '<6 in'; if (d < 12) return '6-12 in'; if (d < 18) return '12-18 in'; if (d < 24) return '18-24 in'; if (d < 36) return '24-36 in'; return '36+ in'; };
const DBH_BANDS = ['<6 in','6-12 in','12-18 in','18-24 in','24-36 in','36+ in'];
const HEALTH_INK = h => h >= 80 ? '#2f7d55' : (h >= 55 ? '#b8842a' : '#b34b48');
const HFOV = 64;
const esc = s => String(s == null ? '' : s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const money = n => { n = parseFloat(n); return isFinite(n) ? '$' + n.toLocaleString('en-US', { maximumFractionDigits: 0 }) : '—'; };
const num = v => { const n = parseFloat(v); return isFinite(n) ? n : 0; };
const lineTotal = t => num(t.removal) + num(t.disposal) + num(t.stump);
const fmtWhen = ts => { const d = new Date(ts); const mo = d.toLocaleString('en-US',{month:'short'}); let h = d.getHours(), ap = h >= 12 ? 'pm':'am'; h = h % 12 || 12; return `${mo} ${d.getDate()} · ${h}:${String(d.getMinutes()).padStart(2,'0')}${ap}`; };
const isoWhen = ts => { const d = new Date(ts); const p = n => String(n).padStart(2,'0'); return `${d.getFullYear()}-${p(d.getMonth()+1)}-${p(d.getDate())} ${p(d.getHours())}:${p(d.getMinutes())}`; };
const fmtCoord = (n, dp=5) => (typeof n === 'number' && isFinite(n)) ? n.toFixed(dp) : '—';
const gpsCell = t => (typeof t.lat === 'number') ? `${t.lat.toFixed(4)}, ${t.lng.toFixed(4)}` : '';

function destPoint(lat, lng, brgDeg, distM) {
  const R = 6371000, d = distM / R, br = brgDeg * Math.PI/180;
  const p1 = lat * Math.PI/180, l1 = lng * Math.PI/180;
  const p2 = Math.asin(Math.sin(p1)*Math.cos(d) + Math.cos(p1)*Math.sin(d)*Math.cos(br));
  const l2 = l1 + Math.atan2(Math.sin(br)*Math.sin(d)*Math.cos(p1), Math.cos(d) - Math.sin(p1)*Math.sin(p2));
  return { lat: p2*180/Math.PI, lng: ((l2*180/Math.PI) + 540) % 360 - 180 };
}
const fmtBearing = b => { const dirs=['N','NNE','NE','ENE','E','ESE','SE','SSE','S','SSW','SW','WSW','W','WNW','NW','NNW']; return `${Math.round(b)}° ${dirs[Math.round(((b%360)+360)%360/22.5)%16]}`; };
const havM = (la1, lo1, la2, lo2) => { const R = 6371000, dLa = (la2-la1)*Math.PI/180, dLo = (lo2-lo1)*Math.PI/180, a = Math.sin(dLa/2)**2 + Math.cos(la1*Math.PI/180)*Math.cos(la2*Math.PI/180)*Math.sin(dLo/2)**2; return 2*R*Math.asin(Math.sqrt(a)); };
/* C11 — the "instant geofenced PDF": stamp where the report was generated relative to the surveyed assets */
function geofenceStamp() {
  const g = S.gpsWatch;
  const pts = S.trees.filter(t => typeof t.lat === 'number');
  if (!g.ok) return 'Report generated without a live GPS fix at time of generation.';
  const here = `${g.lat.toFixed(5)}, ${g.lng.toFixed(5)} (±${Math.round(g.acc)} m)`;
  if (!pts.length) return `Report generated at ${here}.`;
  const dmin = Math.round(Math.min(...pts.map(t => havM(g.lat, g.lng, t.lat, t.lng))));
  return dmin <= 500
    ? `GEOFENCE-VERIFIED — report generated on site at ${here}, within ${dmin} m of the nearest surveyed asset.`
    : `Report generated off site at ${here}, ${(dmin/1000).toFixed(1)} km from the nearest surveyed asset.`;
}

/* ---------------- IndexedDB ---------------- */
const DB = (() => {
  let db;
  const open = () => new Promise((res, rej) => {
    if (db) return res(db);
    const rq = indexedDB.open('trice-survey', 1);
    rq.onupgradeneeded = () => { const d = rq.result; if (!d.objectStoreNames.contains('trees')) d.createObjectStore('trees', { keyPath: 'id' }); if (!d.objectStoreNames.contains('meta')) d.createObjectStore('meta', { keyPath: 'k' }); };
    rq.onsuccess = () => { db = rq.result; res(db); };
    rq.onerror = () => rej(rq.error);
  });
  const tx = async (store, mode, fn) => { const d = await open(); return new Promise((res, rej) => { const t = d.transaction(store, mode); fn(t.objectStore(store)); t.oncomplete = () => res(); t.onerror = () => rej(t.error); }); };
  return {
    allTrees: async () => { const d = await open(); return new Promise((res, rej) => { const rq = d.transaction('trees').objectStore('trees').getAll(); rq.onsuccess = () => res(rq.result || []); rq.onerror = () => rej(rq.error); }); },
    putTree: t => tx('trees', 'readwrite', s => s.put(t)),
    delTree: id => tx('trees', 'readwrite', s => s.delete(id)),
    getMeta: async k => { const d = await open(); return new Promise((res) => { const rq = d.transaction('meta').objectStore('meta').get(k); rq.onsuccess = () => res(rq.result ? rq.result.v : null); rq.onerror = () => res(null); }); },
    setMeta: (k, v) => tx('meta', 'readwrite', s => s.put({ k, v })),
  };
})();

/* ---------------- State ---------------- */
const S = {
  tab: 'survey',
  site: localStorage.getItem('trice_site') || '',
  surveyor: localStorage.getItem('trice_surveyor') || '',
  basemap: localStorage.getItem('trice_basemap') || 'streets',
  job: (() => { try { return JSON.parse(localStorage.getItem('trice_job') || '{}'); } catch (e) { return {}; } })(),
  execRead: localStorage.getItem('trice_read') || '',
  regQ: '', regHaz: 'all', regUser: null, repUser: null,
  mapProject: null, repProject: null,
  users: (() => { try { return JSON.parse(localStorage.getItem('trice_users') || '[]'); } catch (e) { return []; } })(),
  repSecs: (() => { try { return JSON.parse(localStorage.getItem('trice_repsecs') || '{}'); } catch (e) { return {}; } })(),
  repViz: (() => { try { return JSON.parse(localStorage.getItem('trice_repviz') || '{"hazmix":true,"zone":true}'); } catch (e) { return { hazmix: true, zone: true }; } })(),
  usersMeta: [],
  admin: localStorage.getItem('trice_admin') === '1',

const compass = { deg: null, attached: false };
function attachCompass() {
  if (compass.attached) return; compass.attached = true;
  window.addEventListener('deviceorientation', e => {
    if (typeof e.webkitCompassHeading === 'number' && !isNaN(e.webkitCompassHeading)) { compass.deg = e.webkitCompassHeading; compassUI(); }
  }, true);
  window.addEventListener('deviceorientationabsolute', e => {
    if (e.absolute && typeof e.alpha === 'number') { compass.deg = (360 - e.alpha) % 360; compassUI(); }
  }, true);
}
function requestCompass() {
  try {
    if (typeof DeviceOrientationEvent !== 'undefined' && typeof DeviceOrientationEvent.requestPermission === 'function') {
      DeviceOrientationEvent.requestPermission().then(s => { if (s === 'granted') attachCompass(); }).catch(() => {});
    } else attachCompass();
  } catch (e) {}
}

/* ---------------- Team layer: shared sync ----------------
   Every phone pushes its records to /api/sync (a tiny function that ships
   in the same Trice package) and pulls everyone else's. Merge is
   last-write-wins per record; deletions travel as tombstones. If the host
   has no function (local file, plain static server) the app detects it and
   stays device-only with the existing backup/merge flow. */
const SYNC = { enabled: null, last: parseInt(localStorage.getItem('trice_sync_last')||'0',10), status:'idle', lastOk:null, timer:null, pushTimer:null };
function tombs(){ try { return JSON.parse(localStorage.getItem('trice_tombs')||'[]'); } catch(e){ return []; } }
function markDirty(t){ t.updated = Date.now(); t.dirty = true; queueSync(); }
function queueSync(){ clearTimeout(SYNC.pushTimer); SYNC.pushTimer = setTimeout(syncNow, 2500); }
function mergeRemote(list, dels){
  let changed=false;
  for(const rt of (list||[])){
    const i=S.trees.findIndex(t=>t.id===rt.id);
    if(i<0){ S.trees.push(rt); try{DB.putTree(rt);}catch(e){} changed=true; }
    else if((rt.updated||0) > (S.trees[i].updated||0) && !S.trees[i].dirty){ S.trees[i]=rt; try{DB.putTree(rt);}catch(e){} changed=true; }
  }
  for(const id of (dels||[])){
    const i=S.trees.findIndex(t=>t.id===id);
    if(i>=0 && !S.trees[i].dirty){ S.trees.splice(i,1); try{DB.delTree(id);}catch(e){} changed=true; }
  }
  if(changed){ S.trees.sort((a,b)=>a.id<b.id?-1:1); render(); }
  return changed;
}

/* ---------------- Fresh start — nothing is lost ----------------
   Wiping the shared register archives it twice first: permanently on the
   server, and on every phone (Report → Data → Download last archived job).
   Other phones pick up the reset signal on their next sync cycle. */
async function applyRemoteReset(resetAt) {
  try {
    if (S.trees.length) {
      await DB.setMeta('lastArchive', { at: Date.now(), site: S.site, trees: S.trees.map(stripRuntime) });
      for (const t of S.trees) { try { await DB.delTree(t.id); } catch (e) {} }
    }
    const unsynced = S.trees.filter(t => t.dirty);
    S.trees = unsynced;
    for (const t of unsynced) { try { await DB.putTree(stripRuntime(t)); } catch (e) {} }
    if (!unsynced.length) S.seq = 1; try { await DB.setMeta('seq', 1); } catch (e) {}
    localStorage.setItem('trice_tombs', '[]');
    SYNC.last = 0; localStorage.setItem('trice_sync_last', '0');
    localStorage.setItem('trice_reset_seen', String(resetAt));
    S.detailId = null; S.editId = null;

    render();

}

/* ---------------- Push batching — one oversized record can never block the rest ----------------
   The server caps request bodies (~6MB). Pushing every dirty record in one POST
   means one fat photo, or simply a long backlog, silently bricks all pushes.
   Now: oversized photos are shrunk in place, pushes go out in ~3.5MB batches,
   failed batches retry record-by-record, and failures are named out loud. */
const PUSH_BUDGET = 3500000;
async function shrinkRecordPhoto(t) {
  try {
    if (!t.photo || t.photo.length < 1800000) return false;
    const blob = await (await fetch(t.photo)).blob();
    const smaller = await scaleImageFile(blob, 1280, 0.7);
    if (smaller && smaller.length < t.photo.length) { t.photo = smaller; try { await DB.putTree(stripRuntime(t)); } catch (e) {} return true; }
  } catch (e) {}
  return false;
}
function packBatches(list) {
  const batches = []; let cur = [], size = 0;
  for (const t of list) {
    const len = JSON.stringify(t).length;
    if (size + len > PUSH_BUDGET && cur.length) { batches.push(cur); cur = []; size = 0; }
    cur.push(t); size += len;
  }
  if (cur.length) batches.push(cur);
  return batches;
}
async function pushDirtyBatched(baseBody) {
  let dirty = S.trees.filter(t => t.dirty);
  for (const t of dirty) { if (JSON.stringify(t).length > 1800000) await shrinkRecordPhoto(t); }
  dirty = S.trees.filter(t => t.dirty);
  const batches = packBatches(dirty.map(stripRuntime));
  const failed = [];
  let lastResponse = null;
  if (!batches.length) batches.push([]);
  for (let i = 0; i < batches.length; i++) {
    const body = Object.assign({}, baseBody, { push: batches[i] });
    if (i > 0) { body.deletes = []; body.dropProject = null; body.reviveProject = null; }
    try {
      const r = await fetch('/api/sync', { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify(body) });
      if (!r.ok) throw new Error('http ' + r.status);
      lastResponse = await r.json();
      for (const t of batches[i]) { const x = S.trees.find(y => y.id === t.id); if (x && x.dirty) { delete x.dirty; try { DB.putTree(stripRuntime(x)); } catch (e) {} } }
    } catch (e) {
      // batch failed — retry each record alone so one poison record cannot sink the rest
      for (const t of batches[i]) {
        try {
          const r2 = await fetch('/api/sync', { method: 'POST', headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify(Object.assign({}, baseBody, { push: [t], deletes: [], dropProject: null, reviveProject: null })) });
          if (!r2.ok) throw new Error('http ' + r2.status);
          lastResponse = await r2.json();
          const x = S.trees.find(y => y.id === t.id); if (x && x.dirty) { delete x.dirty; try { DB.putTree(stripRuntime(x)); } catch (e2) {} }
        } catch (e2) { failed.push(t.id); }
      }
    }
  }
  return { lastResponse, failed };
}

async function syncNow(){
  // Always try — a cold function start or blip must not disable team sync for the session.
  if(!navigator.onLine){ SYNC.status='offline'; syncChip(); return; }
  try{
    const hadDirty = S.trees.filter(t=>t.dirty).length;
    const { lastResponse, failed } = await pushDirtyBatched({ since: Math.max(0, SYNC.last - 120000), deletes: tombs(), projects: S.projects, reviveProject: S.reviveNext ? (S.joined || null) : null, user: S.surveyor || '' });
    if (!lastResponse) throw new Error('all pushes failed');
    if (failed.length) toast(failed.length + ' record(s) could not reach the server: ' + failed.slice(0,3).join(', ') + (failed.length>3?'…':'') + ' — will retry');
    else if (hadDirty) SYNC.lastPush = Date.now();
    const j = lastResponse;
    SYNC.enabled = true;
    const seenRaw = localStorage.getItem('trice_reset_seen');
    if (seenRaw === null) { localStorage.setItem('trice_reset_seen', String(j.resetAt || 0)); }
    else if (j.resetAt && j.resetAt > parseInt(seenRaw, 10)) { await applyRemoteReset(j.resetAt); }
    mergeRemote(j.trees, j.deletes);
    S.reviveNext = false;
    let projChanged = false;
    if (j.deletedProjects && j.deletedProjects.length) {
      const before = S.projects.length;
      S.projects = S.projects.filter(x => !j.deletedProjects.includes(x));
      if (S.joined && j.deletedProjects.includes(S.joined)) { S.joined = ''; localStorage.removeItem('trice_joined'); }
      projChanged = S.projects.length !== before;
    }
    if (Array.isArray(j.projects)) {
      const add = j.projects.filter(p => p && !S.projects.includes(p) && !(j.deletedProjects || []).includes(p));
      if (add.length) { S.projects.push(...add); projChanged = true; }
    }
    if (projChanged) {
      try { localStorage.setItem('trice_projects', JSON.stringify(S.projects)); } catch (e) {}
      const ae = document.activeElement;
      if (!S.draft && (!ae || !/input|textarea|select/i.test(ae.tagName))) render();
    }
    if (Array.isArray(j.users)) {
      const uadd = j.users.filter(u => u && !S.users.includes(u));
      if (uadd.length) { S.users.push(...uadd); try { localStorage.setItem('trice_users', JSON.stringify(S.users)); } catch (e) {} }
    }
    if (Array.isArray(j.usersMeta)) {
      S.usersMeta = j.usersMeta;
      if (S.tab === 'map' && !S.draft) { const ae2 = document.activeElement; if (!ae2 || !/input|textarea|select/i.test(ae2.tagName)) render(); }
    }
    for(const t of dirty){ const x=S.trees.find(y=>y.id===t.id); if(x){ delete x.dirty; try{DB.putTree(stripRuntime(x));}catch(e){} } }
    localStorage.setItem('trice_tombs','[]');
    SYNC.last = j.now || Date.now(); localStorage.setItem('trice_sync_last', String(SYNC.last));
    SYNC.status='ok'; SYNC.lastOk=Date.now();
  }catch(e){ if(SYNC.enabled!==true) SYNC.enabled=false; SYNC.status='err'; SYNC.lastErr=(e&&e.message)||'network'; }
  syncChip();
}
function syncChip(){
  const el=document.getElementById('syncChip'); if(!el) return;
  let txt, col;
  if(SYNC.enabled===false){ txt='This device only'; col='var(--faint)'; }
  else if(SYNC.status==='ok'){ txt='Team-synced'; col='var(--good)'; }

function loadCaps() { try { return JSON.parse(localStorage.getItem('trice_caps') || 'null'); } catch (e) { return null; } }
const CHECK_DEFS = [
  ['secure',  'Secure connection', 'Camera and GPS need HTTPS'],
  ['storage', 'On-device storage', 'Where the survey lives between shifts'],
  ['camera',  'Camera',            'Live viewfinder, or the system camera'],
  ['gps',     'GPS fix',           'Accuracy of the position lock'],

  ['voice',   'Voice notes',       'Tap-to-talk on arborist notes'],

async function runDeviceCheck() {
  if (S.check && S.check.running) return;
  const caps = { when: Date.now() };
  S.check = { rows: {}, running: true }; S.showCheck = true;
  CHECK_DEFS.forEach(([k]) => S.check.rows[k] = { st: 'pending', msg: 'Checking…' });
  render();
  // 1 · secure context
  caps.secure = !!window.isSecureContext || location.protocol === 'https:' || ['localhost', '127.0.0.1'].includes(location.hostname);
  setChk('secure', caps.secure ? 'pass' : 'fail', caps.secure ? 'HTTPS — camera and GPS allowed' : 'Not HTTPS — deploy the app on a secure URL');
  // 2 · storage
  try {
    await DB.setMeta('probe', Date.now()); caps.storage = true;
    let sticky = false;
    try { if (navigator.storage && navigator.storage.persist) sticky = await navigator.storage.persist(); } catch (e) {}
    caps.persisted = sticky;
    setChk('storage', 'pass', sticky ? 'Protected — the phone will not clear this data automatically' : 'Working — Add to Home Screen to protect it from OS cleanup');
  }
  catch (e) { caps.storage = false; setChk('storage', 'warn', 'Session-only — back up from Report before closing'); }
  // 3 · camera (this tap is the user gesture the browser needs)
  if (navigator.mediaDevices && navigator.mediaDevices.getUserMedia) {
    try {
      const s = await navigator.mediaDevices.getUserMedia({ video: { facingMode: { ideal: 'environment' } }, audio: false });
      s.getTracks().forEach(t => t.stop());
      caps.camera = 'live'; setChk('camera', 'pass', 'Live in-app viewfinder with compass overlay');
    } catch (e) {
      caps.camera = 'system'; setChk('camera', e && e.name === 'NotAllowedError' ? 'warn' : 'warn', e && e.name === 'NotAllowedError' ? 'Permission denied — will open the system camera instead' : 'Will open the system camera instead');
    }
  } else { caps.camera = 'system'; setChk('camera', 'warn', 'Will open the system camera instead'); }

  try {

    S.camOpen = true; render();

function fallbackFile() {

  inp.type = 'file'; inp.accept = 'image/*'; inp.setAttribute('capture', 'environment');

function shutter() {
  const v = document.getElementById('camVideo'); if (!v || !v.videoWidth) return;
  const maxDim = 1500, sc = Math.min(1, maxDim / Math.max(v.videoWidth, v.videoHeight));
  const c = document.createElement('canvas');
  c.width = Math.round(v.videoWidth * sc); c.height = Math.round(v.videoHeight * sc);
  c.getContext('2d').drawImage(v, 0, 0, c.width, c.height);
  const dataUrl = c.toDataURL('image/jpeg', 0.85);
  const heading = compass.deg;
  closeCamera();
  newDraft(dataUrl, heading);
}
function framePicked(file) {
  const img = new Image(); const url = URL.createObjectURL(file);
  img.onload = () => {
    const maxDim = 1500, sc = Math.min(1, maxDim / Math.max(img.width, img.height));
    const c = document.createElement('canvas'); c.width = Math.round(img.width*sc); c.height = Math.round(img.height*sc);
    c.getContext('2d').drawImage(img, 0, 0, c.width, c.height);
    URL.revokeObjectURL(url);
    newDraft(c.toDataURL('image/jpeg', 0.85), compass.deg);

/* ---------------- Crop ---------------- */
function cropFromDataUrl(dataUrl, bbox) {
  return new Promise(res => {
    const img = new Image();
    img.onload = () => {
      const pad = 0.06;
      let x = Math.max(0, (bbox.x - pad)) * img.width;
      let y = Math.max(0, (bbox.y - pad)) * img.height;
      let w = Math.min(1 - Math.max(0, bbox.x - pad), bbox.w + pad*2) * img.width;
      let h = Math.min(1 - Math.max(0, bbox.y - pad), bbox.h + pad*2) * img.height;
      if (w < 40 || h < 40) { res(dataUrl); return; }
      const c = document.createElement('canvas'); c.width = Math.round(w); c.height = Math.round(h);
      c.getContext('2d').drawImage(img, x, y, w, h, 0, 0, c.width, c.height);
      res(c.toDataURL('image/jpeg', 0.85));
    };
    img.onerror = () => res(dataUrl);
    img.src = dataUrl;
  });
}

/* ---------------- AI ---------------- */
const AI_SYSTEM = `You are a board-certified master arborist (ISA BCMA) performing rapid visual tree assessments to TRAQ methodology from a single field photo, feeding the WTR field data schema. You are also the vision system: localize each distinct assessable tree and estimate its distance from the camera using scale cues (trunk diameter vs. known objects, ground plane, people, carts, light poles).

SPECIES IDENTIFICATION PROTOCOL
- Use the GPS coordinates provided to infer the region and weight species priors to that region's flora before naming anything.
- Identify from bark texture, branching architecture, leaf/frond form, crown shape, and trunk taper. If species is uncertain, give the genus confidently and say so ("Oak (Quercus sp.)") rather than guessing a species. Confidence must reflect real uncertainty.

BROADLEAF / CONIFER ASSESSMENT (VTA)
- Look for: fungal fruiting bodies at the root collar or trunk (Ganoderma, Armillaria, Inonotus), cavities, cracks, seams, included bark at codominant unions, deadwood proportion, canopy dieback percentage and pattern, epicormic sprouting (stress signal), lean with soil heave or root-plate lift, girdling roots, previous topping cuts, hangers.

PALMS ARE NOT TREES — ASSESS THEM AS PALMS
- No DBH-based decay logic; a palm has one growing point. Assess: canopy fullness (number of green fronds vs. expected for the species), frond discoloration patterns (uniform oldest-frond yellowing = potassium deficiency; new-growth deformity/frizzle top = manganese/boron; rapid uniform browning = lethal bronzing/lethal yellowing — flag as urgent), Ganoderma conk at the base (unsalvageable — recommend removal), pencil-pointing of the trunk, nutrient banding, and whether the bud/spear appears intact. Never call normal boot/leaf-base texture on a palm trunk "decay."

SCALE & MEASUREMENT PROTOCOL
- Anchor every size estimate to a visible reference before trusting instinct: people (~5.5–6 ft), golf flagsticks (7–8 ft), golf carts (~4 ft tall, 8 ft long), fences (~4 ft), doors (6.7 ft), vehicles, cart paths (~7 ft wide), bunker rakes (~5 ft). Name what you used in "scale_reference"; with no reference, derive scale from the trunk's angular size and your distance estimate and say so ("angular size at ~18 m").
- Work the geometry: estimate camera-to-trunk distance from the ground plane first, then height from how much of the frame the tree spans at that distance. A tree filling the vertical frame at 20 m is ~45–60 ft, not 25.
- DBH: read trunk width at ~4.5 ft above the base against your reference and distance. Mature canopy trees on maintained golf turf are rarely under 18″ DBH — do not default to nursery-stock sizes. Single-photo errors are almost always UNDERESTIMATES: when torn between two numbers, take the larger unless the reference says otherwise.
- Sanity-check the trio: height, DBH and crown spread must be plausible together for the species; state honest ± ranges in findings when the reference is weak.

SCORING DISCIPLINE
- Health 0-100 reflects the whole organism as seen. Hazard rating weighs likelihood of failure x likelihood of impact x consequence (use visible targets: paths, structures, vehicles, play areas).
- The "why" is 1-2 sentences in first-person working-arborist voice, naming the deciding observation.
- Estimates from one photo are estimates: use "~" and honest ranges. Describe what you SEE in the description (observation, not conclusion) and reserve judgement for the hazard rating and recommendation. If the photo cuts off the crown or base, say what you could not evaluate in the findings.`;

function aiPrompt(zone, site, coords) {
  const j = S.job || {};
  const where = coords ? `\nGPS of the camera: ${coords} — infer the region and use regional species priors.` : '';
  const post = ['Post-Loss Assessment','Storm Response','Forensic Claim Audit'].includes(j.assessType);
  const storm = post
    ? `\nThis is a ${j.assessType ? j.assessType.toUpperCase() : 'POST-LOSS ASSESSMENT'}${j.stormName ? ` following ${j.stormName}` : ''}${j.dateOfLoss ? ` (date of loss ${j.dateOfLoss})` : ''}. Look first for storm damage: hangers and broken limbs, failed unions or trunk splits, canopy torsion, root-plate lift or full uprooting, fresh canopy loss. Name the failure mode — a carrier will contest "storm".`
    : '';
  return `Assess the tree or trees in this photo${site ? ` at ${site}` : ''}${zone ? ` (zone: ${zone})` : ''}.${storm}${where}

Identify each DISTINCT tree that is substantially visible and assessable (trunk visible, most of crown in frame). Ignore background canopy and trees too small or distant to assess. Maximum 4. Most photos contain exactly one. If one line covers a tight cluster of identical damaged specimens, use qty > 1. The photographer aims a center-frame crosshair at the target trunk — the tree under or nearest the frame center is the primary subject; list it first.

Respond ONLY with a JSON object, no markdown fences, no preamble:
{"trees":[
 {
  "bbox": {"x":0.0-1.0,"y":0.0-1.0,"w":0.0-1.0,"h":0.0-1.0},
  "distance_m": <integer meters from camera to trunk>,
  "qty": <integer, specimens covered by this record, usually 1>,
  "species": "common name, or 'Unidentified'",
  "latin": "Latin binomial or ''",
  "confidence": <0-100 species-ID confidence>,
  "dbh_in": <integer, estimated diameter at breast height in inches>,
  "height_ft": <integer, estimated height in feet>,
  "scale_reference": "the visible object or method you scaled from — e.g. 'flagstick on green' or 'angular size at ~18 m'",
  "canopy": "2-4 words, e.g. 'Full, dense' or '40% dieback'",
  "hazard": "High Hazard" | "Moderate" | "Cleared",  // High Hazard = immediate life/safety risk or structural failure; Moderate = prune, cable or monitor; Cleared = low risk / no action
  "cause": one of ${JSON.stringify(CAUSES)},  // the failure mode or condition driver; 'Undetermined' if genuinely unclear

  "description": "what you SEE — 1-2 sentences of visual observation, not conclusion",
  "findings": ["3 short specific field observations"],
  "health": <integer 0-100; >=80 healthy, 55-79 declining, <55 failing>,
  "action": "one-line recommendation with a timeframe — treat, prune, cable, monitor, or remove",
  "why": "1-2 sentences, first-person arborist voice",
  "targets": "what this tree could hit if it fails, or 'None visible'"
 }
]}
If no assessable tree is present, return {"error":"No tree detected in this photo."}`;
}

/* Reads a response from /api/analyze — either plain JSON or a streamed SSE relay. */
async function readClaudeText(resp) {
  const ct = resp.headers.get('content-type') || '';
  if (ct.includes('text/html')) { const e = new Error("Trice AI relay is offline on this site — ask your admin to republish the full Trice package."); e.aiOff = true; throw e; }
  if (!ct.includes('event-stream')) {
    const data = await resp.json();
    return (data.content || []).filter(b => b.type === 'text').map(b => b.text).join('\n');
  }
  const rd = resp.body.getReader(), dec = new TextDecoder();
  let buf = '', out = '';
  for (;;) {
    const { done, value } = await rd.read(); if (done) break;
    buf += dec.decode(value, { stream: true });
    const lines = buf.split('\n'); buf = lines.pop();
    for (const ln of lines) {
      if (!ln.startsWith('data:')) continue;
      const s = ln.slice(5).trim(); if (!s) continue;
      let ev; try { ev = JSON.parse(s); } catch (e) { continue; }
      if (ev.type === 'content_block_delta' && ev.delta && typeof ev.delta.text === 'string') out += ev.delta.text;
      else if (ev.type === 'error') throw new Error((ev.error && ev.error.message) || 'The analysis stream failed — try again.');
    }
  }
  return out;
}

async function callClaude(dataUrl, zone, coords) {
  const b64 = dataUrl.split(',')[1];
  let resp;
  try {
    resp = await fetch('/api/analyze', {
    method: 'POST', headers: { 'Content-Type': 'application/json' },
    body: JSON.stringify({
      max_tokens: 2200, system: AI_SYSTEM,
      messages: [{ role: 'user', content: [
        { type: 'image', source: { type: 'base64', media_type: 'image/jpeg', data: b64 } },
        { type: 'text', text: aiPrompt(zone, S.site, coords) + correctionsDigest() }
      ]}]
    })
  });
  } catch (netErr) {
    throw new Error("Couldn't reach Trice. Check signal and retry — the capture is saved either way.");
  }
  if (!resp.ok) {
    if (resp.status === 503) { const e = new Error("Trice AI isn't switched on for this site yet — ask your Trice admin. The capture is saved either way."); e.aiOff = true; throw e; }
    if (resp.status === 404) { const e = new Error("Trice AI relay is offline on this site — ask your admin to republish the full Trice package."); e.aiOff = true; throw e; }
    if (resp.status === 401 || resp.status === 403) throw new Error("Trice AI credentials were rejected — ask your Trice admin to re-check the site setup.");
    throw new Error(`Trice analysis error (${resp.status}). Try again in a moment.`);
  }
  const text = await readClaudeText(resp);
  const clean = text.replace(/```json|```/g, '').trim();
  const start = clean.indexOf('{'), end = clean.lastIndexOf('}');
  if (start < 0 || end < 0) throw new Error('The model returned an unreadable result. Try again.');
  const j = JSON.parse(clean.slice(start, end + 1));
  if (j.error) throw new Error(j.error);
  let arr = Array.isArray(j.trees) ? j.trees : [j];
  arr = arr.slice(0, 4).map(a => {
    a.health = Math.max(0, Math.min(100, parseInt(a.health, 10) || 0));
    a.confidence = Math.max(0, Math.min(100, parseInt(a.confidence, 10) || 0));
    if (!HAZARDS.includes(a.hazard)) a.hazard = a.health >= 80 ? 'Cleared' : (a.health >= 55 ? 'Moderate' : 'High Hazard');
    if (!CAUSES.includes(a.cause)) a.cause = 'Undetermined';
    a.failures = Array.isArray(a.failures) ? a.failures.filter(f => FAILURES.includes(f)) : [];
    a.findings = Array.isArray(a.findings) ? a.findings.slice(0, 4) : [];
    a.qty = Math.max(1, Math.min(50, parseInt(a.qty, 10) || 1));
    a.dbh_in = Math.max(0, Math.min(200, parseInt(a.dbh_in, 10) || 0)) || null;
    a.height_ft = Math.max(0, Math.min(200, parseInt(a.height_ft, 10) || 0)) || null;
    a.scale_reference = typeof a.scale_reference === 'string' ? a.scale_reference.slice(0, 90) : '';
    a.distance_m = Math.max(1, Math.min(200, parseInt(a.distance_m, 10) || 0)) || null;
    const b = a.bbox || {};
    a.bbox = { x: clamp01(b.x), y: clamp01(b.y), w: clamp01(b.w) || 1, h: clamp01(b.h) || 1 };
    return a;
  });
  if (!arr.length) throw new Error('No tree detected in this photo.');
  return arr;
}
const clamp01 = v => { v = parseFloat(v); return isFinite(v) ? Math.max(0, Math.min(1, v)) : 0; };

/* The app learns from its users: signed overrides feed the next analysis as calibration. */
function correctionsDigest() {
  const cs = S.trees.filter(t => t.reviewed && t.aiOriginal).slice(-12).map(t => {
    const o = t.aiOriginal || {}, d = [];
    if (o.species && t.ai && t.ai.species && o.species !== t.ai.species) d.push(`species ${o.species} → ${t.ai.species}`);
    if (o.dbh_in != null && t.dbhIn != null && o.dbh_in !== t.dbhIn) d.push(`DBH ${o.dbh_in}″ → ${t.dbhIn}″`);
    if (o.height_ft != null && t.heightFt != null && o.height_ft !== t.heightFt) d.push(`height ${o.height_ft} → ${t.heightFt} ft`);
    if (o.hazard && t.hazard && o.hazard !== t.hazard) d.push(`hazard ${o.hazard} → ${t.hazard}`);
    if (o.action && t.ai && t.ai.action && o.action !== t.ai.action) d.push(`recommendation "${o.action}" → "${t.ai.action}"`);
    return d.length ? `- ${d.join('; ')}` : null;
  }).filter(Boolean);

}

function positionTree(d, det) {
  const camOk = typeof d.camLat === 'number';
  if (!camOk) return { lat: null, lng: null, method: 'none' };
  if (typeof d.heading === 'number' && det.ai.distance_m) {
    const xC = det.ai.bbox.x + det.ai.bbox.w / 2;
    const bearing = ((d.heading + (xC - 0.5) * HFOV) % 360 + 360) % 360;
    const p = destPoint(d.camLat, d.camLng, bearing, det.ai.distance_m);
    return { lat: p.lat, lng: p.lng, method: 'offset', bearing, dist: det.ai.distance_m };
  }
  return { lat: d.camLat, lng: d.camLng, method: 'camera' };
}
function recomputeDraftPositions() {
  const d = S.draft; if (!d || !d.results) return;
  for (const det of d.results) {
    const p = positionTree(d, det);
    det.lat = p.lat; det.lng = p.lng; det.method = p.method; det.bearing = p.bearing; det.dist = p.dist;
  }
}

async function analyzeDraft() {
  const d = S.draft; if (!d || d.analyzing) return;
  if (!navigator.onLine) { d.error = 'You appear to be offline. The photo, GPS and timestamp are saved — capture the hazard and failure type by hand below, log it, and run analysis later.'; d.results = d.results || [manualDetection(d)]; render(); return; }
  d.analyzing = true; d.error = null; render();
  try {
    const arr = await callClaude(d.photo, d.zone, (typeof d.camLat === 'number') ? `${d.camLat.toFixed(4)}, ${d.camLng.toFixed(4)}` : null);
    const multi = arr.length > 1;
    d.results = [];
    for (const ai of arr) {
      const crop = multi ? await cropFromDataUrl(d.photo, ai.bbox) : d.photo;
      d.results.push({ ai, crop, include: true, hazard: ai.hazard, cause: ai.cause, failures: ai.failures.slice(), qty: ai.qty, ip: 'IP', mgd: 'No', notes: '' });
    }
    if (multi) {
      let ti = -1, best = Infinity;
      d.results.forEach((r, i) => {
        const b = (r.ai && r.ai.bbox) || {};
        const inside = 0.5 >= b.x && 0.5 <= b.x + b.w && 0.5 >= b.y && 0.5 <= b.y + b.h;
        const dist = Math.hypot(b.x + b.w / 2 - 0.5, b.y + b.h / 2 - 0.5) - (inside ? 1 : 0);
        if (dist < best) { best = dist; ti = i; }
      });
      if (ti >= 0) d.results.forEach((r, i) => { r.include = i === ti; r.crosshair = i === ti; });
    }
    recomputeDraftPositions();
    d.analyzing = false; render();
    if (multi) toast(`${arr.length} trees found — the one under your crosshair is selected`);
  } catch (e) {
    d.analyzing = false;
    d.error = e.aiOff ? 'AI_OFF' : (e.message || 'Analysis failed. Check connection and try again.');
    if (!d.results) d.results = [manualDetection(d)];

}
function manualDetection(d) {

/* ---- Import photos taken outside the app (camera roll) ---- */
function scaleImageFile(file, maxDim = 1600, q = 0.82) {
  return new Promise((res, rej) => {
    const url = URL.createObjectURL(file);
    const im = new Image();
    im.onload = () => { try { const s = Math.min(1, maxDim / Math.max(im.width, im.height)); const c = document.createElement('canvas'); c.width = Math.max(1, Math.round(im.width * s)); c.height = Math.max(1, Math.round(im.height * s)); c.getContext('2d').drawImage(im, 0, 0, c.width, c.height); URL.revokeObjectURL(url); res(c.toDataURL('image/jpeg', q)); } catch (e) { URL.revokeObjectURL(url); rej(e); } };
    im.onerror = () => { URL.revokeObjectURL(url); rej(new Error('unreadable image')); };
    im.src = url;
  });
}
async function exifMeta(file) {
  try {
    const b = new Uint8Array(await file.slice(0, 262144).arrayBuffer());
    if (b[0] !== 0xFF || b[1] !== 0xD8) return {};
    let i = 2;
    while (i + 4 < b.length) {
      if (b[i] !== 0xFF) break;
      const marker = b[i + 1], len = (b[i + 2] << 8) | b[i + 3];
      if (marker === 0xE1 && b[i + 4] === 0x45 && b[i + 5] === 0x78 && b[i + 6] === 0x69 && b[i + 7] === 0x66) return parseTiff(b, i + 10);
      i += 2 + len;
    }
  } catch (e) {}
  return {};
}
function parseTiff(b, off) {
  const out = {};
  try {
    const le = b[off] === 0x49;
    const u16 = p => le ? b[p] | (b[p + 1] << 8) : (b[p] << 8) | b[p + 1];
    const u32 = p => (le ? b[p] | (b[p + 1] << 8) | (b[p + 2] << 16) | (b[p + 3] << 24) : (b[p] << 24) | (b[p + 1] << 16) | (b[p + 2] << 8) | b[p + 3]) >>> 0;
    const rat = p => { const n = u32(p), d = u32(p + 4); return d ? n / d : 0; };
    const SZ = { 1: 1, 2: 1, 3: 2, 4: 4, 5: 8, 7: 1, 10: 8 };
    const readIFD = (ifdOff, tags) => {
      const res = {}; const n = u16(off + ifdOff);
      for (let k = 0; k < n; k++) {
        const e = off + ifdOff + 2 + k * 12;
        const tag = u16(e), type = u16(e + 2), cnt = u32(e + 4);
        let vOff = e + 8;
        if ((SZ[type] || 1) * cnt > 4) vOff = off + u32(e + 8);
        if (tags.includes(tag)) res[tag] = { cnt, vOff };
      }
      return res;
    };
    const ifd0 = readIFD(u32(off + 4), [0x8769, 0x8825]);
    if (ifd0[0x8825]) {
      const g = readIFD(u32(ifd0[0x8825].vOff), [1, 2, 3, 4]);
      if (g[2] && g[4]) {
        const dms = r => rat(r.vOff) + rat(r.vOff + 8) / 60 + rat(r.vOff + 16) / 3600;
        let lat = dms(g[2]), lng = dms(g[4]);
        if (g[1] && String.fromCharCode(b[g[1].vOff]) === 'S') lat = -lat;
        if (g[3] && String.fromCharCode(b[g[3].vOff]) === 'W') lng = -lng;
        if (isFinite(lat) && isFinite(lng) && (lat || lng)) { out.lat = lat; out.lng = lng; }
      }
    }
    if (ifd0[0x8769]) {
      const ex = readIFD(u32(ifd0[0x8769].vOff), [0x9003]);
      if (ex[0x9003]) {
        let s = ''; for (let k = 0; k < Math.min(ex[0x9003].cnt, 20); k++) s += String.fromCharCode(b[ex[0x9003].vOff + k]);
        const m = s.match(/(\d{4}):(\d{2}):(\d{2}) (\d{2}):(\d{2}):(\d{2})/);
        if (m) out.when = new Date(+m[1], +m[2] - 1, +m[3], +m[4], +m[5], +m[6]).getTime();
      }
    }
  } catch (e) {}
  return out;
}

function totals(src) {

    byHaz: {}, byIP: { IP: { lines: 0, specimens: 0, cost: 0 }, OP: { lines: 0, specimens: 0, cost: 0 } }, byBand: {}, byZone: {}, missingPhoto: 0, unpriced: 0 };

  for (const b of DBH_BANDS) T.byBand[b] = { lines: 0, specimens: 0 };
  for (const t of src) {
    const q = t.qty || 1, lt = lineTotal(t);
    T.specimens += q; T.removal += num(t.removal); T.disposal += num(t.disposal); T.stump += num(t.stump); T.total += lt;
    if (T.byHaz[t.hazard]) { T.byHaz[t.hazard].lines++; T.byHaz[t.hazard].specimens += q; T.byHaz[t.hazard].cost += lt; }

}

Register (JSON): ${JSON.stringify(compact)}

Write 2-3 tight paragraphs, plain prose, no headers, no bullets, no markdown. Lead with the single most important call, naming specific asset IDs for anything urgent (in-play high-hazard first — closed holes cost revenue). State what should happen this week vs this season, note what is cleared or healthy, and close with the record-keeping value of the dated, coordinates-attached register. Confident, specific, working-arborist voice. Do not invent assets or numbers.`;

function posLine(t) {
  if (typeof t.lat !== 'number') return '<span class="chip warn">No GPS</span>';
  if (t.posMethod === 'adjusted') return '<span class="chip good">Position verified on imagery</span>';
  if (t.posMethod === 'exif') return '<span class="chip info">Position from photo EXIF</span>';
  if (t.posMethod === 'offset') return `<span class="chip info">Offset ${t.dist} m @ ${fmtBearing(t.bearing)}</span>`;
  return '<span class="chip info">Camera position</span>';
}

/* Rapid-capture controls: three hazard buttons, four failure chips, qty, IP/OP */
function hazButtons(i, val) {
  return `<div style="display:grid;grid-template-columns:1fr 1fr 1fr;gap:6px">${HAZARDS.map(h => {
    const on = val === h;
    const c = HAZ_INK(h);
    return `<button onclick="setDet(${i},'hazard','${h}')" style="border:2px solid ${on ? c : 'var(--line)'};background:${on ? c : '#fff'};color:${on ? '#fff' : 'var(--body)'};border-radius:11px;padding:10px 4px;font-size:12px;font-weight:700">${h === 'High Hazard' ? '▲ High Hazard' : (h === 'Moderate' ? '● Moderate' : '■ Cleared')}</button>`;
  }).join('')}</div>`;
}
function failChips(i, arr) {
  return `<div style="display:flex;gap:6px;flex-wrap:wrap">${FAILURES.map(f => {
    const on = (arr || []).includes(f);
    return `<button onclick="toggleFail(${i},'${f}')" class="chip ${on ? 'info' : ''}" style="border:1px solid ${on ? 'transparent' : 'var(--line)'};background:${on ? '' : '#fff'};${on ? '' : 'color:var(--muted);'}padding:7px 12px">${f}</button>`;
  }).join('')}</div>`;
}
function setDet(i, k, v) { const r = S.draft && S.draft.results && S.draft.results[i]; if (!r) return; r[k] = v; render(); }
function setDetAI(i, k, v) { const r = S.draft && S.draft.results && S.draft.results[i]; if (!r) return; r.ai = r.ai || {}; if (k === 'dbh_in' || k === 'height_ft') { const n = parseFloat(v); r.ai[k] = isFinite(n) ? n : null; } else r.ai[k] = v; }
function draftSelectAll(v) { ((S.draft || {}).results || []).forEach(r => r.include = v); render(); }
function targetPicker(rs) {

function toggleFail(i, f) { const r = S.draft && S.draft.results && S.draft.results[i]; if (!r) return; const ix = r.failures.indexOf(f); if (ix >= 0) r.failures.splice(ix, 1); else r.failures.push(f); render(); }

    <div style="font-size:16px;font-weight:700;margin-top:7px">${esc(a.species || 'Unidentified')}${(t.qty||1) > 1 ? ` <span style="font-size:12px;color:var(--muted);font-weight:600">× ${t.qty} specimens</span>` : ''}</div>
    <div style="font-size:12px;color:var(--muted);font-style:italic">${esc(a.latin || '')}</div>
    <div style="margin-top:12px;display:flex;align-items:flex-end;gap:12px">
      <div><div style="font-size:30px;font-weight:700;letter-spacing:-.02em;color:${HEALTH_INK(h)}">${h}</div><div style="font-size:11px;color:var(--faint)">Health score</div></div>
      <div style="flex:1"><div style="height:8px;border-radius:999px;background:var(--bg);overflow:hidden"><div style="height:100%;width:${h}%;background:${HEALTH_INK(h)}"></div></div><div style="margin-top:7px">${hazChipHTML(haz)}</div></div>
    </div>
    <div class="stat3" style="margin-top:13px">
      <div class="cell"><div class="k">DBH</div><div class="v">${t.dbhIn ?? a.dbh_in ?? '—'}${(t.dbhIn ?? a.dbh_in) ? '″' : ''}</div></div>
      <div class="cell"><div class="k">Height</div><div class="v">${t.heightFt ?? a.height_ft ?? '—'}${(t.heightFt ?? a.height_ft) ? ' ft' : ''}</div></div>
      <div class="cell"><div class="k">Canopy</div><div class="v">${esc(a.canopy || '—')}</div></div>
    </div>
    ${a.scale_reference ? `<div style="margin-top:8px;font-size:11px;color:var(--faint)">Scaled from: ${esc(a.scale_reference)} · correct any miss and the AI recalibrates</div>` : ''}
    ${(t.cause || (t.failures||[]).length) ? `<div style="margin-top:11px;display:flex;gap:6px;flex-wrap:wrap">${t.cause ? `<span class="chip info">${esc(t.cause)}</span>` : ''}${(t.failures||[]).map(f => `<span class="chip" style="color:var(--body);background:var(--soft)">${esc(f)}</span>`).join('')}</div>` : ''}
    ${a.description ? `<div style="margin-top:11px;font-size:12.5px;color:var(--body)"><span style="font-weight:600">Observed:</span> ${esc(a.description)}</div>` : ''}
    ${(a.findings || []).length ? `<div class="slab" style="margin-top:12px">Findings</div>
    <div style="margin-top:7px;display:flex;flex-direction:column;gap:6px">
      ${a.findings.map(f => `<div style="font-size:12.5px;color:var(--body);display:flex;gap:8px;align-items:flex-start"><span class="dot" style="background:${dotC}"></span><span>${esc(f)}</span></div>`).join('')}
    </div>` : ''}

    ${a.action ? `<div style="margin-top:13px;background:${recBg};border-radius:11px;padding:11px 13px"><div style="font-size:10.5px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;color:${dotC}">Recommended</div><div style="font-size:13px;font-weight:600;color:${recInk};margin-top:3px">${esc(a.action)}</div></div>` : ''}

/* One-screen start: your name once, then projects. A walk always logs into a project. */
function saveName() {
  const el = document.getElementById('obName'); const name = ((el && el.value) || '').trim();
  if (!name) { toast('Your name goes on every record — add it'); return; }
  selectUser(name);
}
function knownUsers() {
  const s = new Set(S.users);
  for (const t of S.trees) if (t.surveyor) s.add(t.surveyor);
  if (S.surveyor) s.add(S.surveyor);
  return [...s].sort((a, b) => a.localeCompare(b));
}
function selectUser(name) {
  S.surveyor = name; localStorage.setItem('trice_surveyor', name);
  if (!S.users.includes(name)) { S.users.push(name); try { localStorage.setItem('trice_users', JSON.stringify(S.users)); } catch (e) {} }
  queueSync();
  const mine = S.trees.filter(t => t.surveyor === name).sort((a, b) => (b.when || 0) - (a.when || 0));
  const last = mine[0] && siteOfT(mine[0]);
  if (last && S.site !== last) {
    S.site = last; localStorage.setItem('trice_site', last); localStorage.setItem('trice_joined', '1');
    S.job = S.job || {}; S.job.propCode = S.job.propCode || last.split(/\s+/).map(w => w[0]).join('').slice(0, 4).toUpperCase();
    localStorage.setItem('trice_job', JSON.stringify(S.job));
    toast(`Welcome back, ${name} — resuming ${last}`);
  } else toast(`Signed in as ${name}${S.site ? ' · ' + S.site : ''}`);
  render();
}
function switchUser() { const cur = (S.surveyor || '').trim(); if (cur && !S.users.includes(cur)) { S.users.push(cur); try { localStorage.setItem('trice_users', JSON.stringify(S.users)); } catch (e) {} } S.surveyor = ''; try { localStorage.removeItem('trice_surveyor'); } catch (e) {} S.tab = 'survey'; render(); }
function promptRename() { const n = prompt('Rename "' + S.surveyor + '" to:', S.surveyor); if (n != null) renameUser(S.surveyor, n); }
async function renameUser(oldName, newName) {
  newName = (newName || '').trim(); if (!newName || newName === oldName) return;
  for (const t of S.trees) if (t.surveyor === oldName) { t.surveyor = newName; t.updated = Date.now(); t.dirty = true; try { await DB.putTree(stripRuntime(t)); } catch (e) {} }
  S.users = S.users.filter(u => u !== oldName);
  if (!S.users.includes(newName)) S.users.push(newName);
  try { localStorage.setItem('trice_users', JSON.stringify(S.users)); } catch (e) {}
  S.surveyor = newName; localStorage.setItem('trice_surveyor', newName);
  try { fetch('/api/sync', { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ since: Date.now(), push: [], deletes: [], projects: [], user: newName, dropUser: oldName }) }); } catch (e) {}
  queueSync();
  toast(`Renamed to ${newName} — records and the team roster updated`);
  render();
}
function allProjects() {
  const s = new Set(S.projects);
  if (S.site) s.add(S.site);
  for (const t of S.trees) if (t.site) s.add(t.site);
  return [...s].sort();
}

async function deleteProject(name) {
  if (!confirm('Delete the empty project "' + name + '" for the whole team?')) return;
  try {
    const r = await fetch('/api/sync', { method: 'POST', headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ since: Date.now(), push: [], deletes: [], dropProject: name, user: S.surveyor || '' }) });
    if (r.status === 409) { const j = await r.json(); toast('"' + name + '" still holds ' + j.trees + ' record' + (j.trees > 1 ? 's' : '') + ' — projects with work cannot be deleted'); return; }
    if (!r.ok) throw new Error('http ' + r.status);
    S.projects = S.projects.filter(x => x !== name);
    localStorage.setItem('trice_projects', JSON.stringify(S.projects));
    if (S.joined === name) { S.joined = ''; localStorage.removeItem('trice_joined'); }
    toast('"' + name + '" deleted for the team');
    render();
  } catch (e) { toast('Could not reach the server — try again with signal'); }
}

function selectProject(name) {
  if (S.site === name) {
    S.site = ''; try { localStorage.removeItem('trice_site'); } catch (e) {}
    toast(`Left ${name} — its records stay filed under it`); render(); return;
  }
  S.site = name; localStorage.setItem('trice_site', name); localStorage.setItem('trice_joined', '1');
  if (!S.projects.includes(name)) { S.projects.push(name); localStorage.setItem('trice_projects', JSON.stringify(S.projects)); }
  queueSync();
  S.job = S.job || {};
  S.job.propCode = name.split(/\s+/).map(w => w[0]).join('').slice(0, 4).toUpperCase();
  localStorage.setItem('trice_job', JSON.stringify(S.job));
  toast(`Joined ${name}`); render();
}
function createProject() {
  S.reviveNext = true;
  const el = document.getElementById('projNew'); const v = ((el && el.value) || '').trim();
  if (!v) { toast('Name the project'); return; }
  selectProject(v);
}
async function syncDiag() {
  toast('Testing team sync…');
  try {
    const r = await fetch('/api/sync', { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ since: Date.now(), push: [], deletes: [], projects: [], user: S.surveyor || '' }) });
    if (r.ok) { const j = await r.json(); const np = (j.projects || []).length; toast(`Team sync is LIVE — server reachable, ${np} shared project${np === 1 ? '' : 's'} on file. This device syncs every 25 seconds.`); await syncNow(); }
    else if (r.status === 503) toast('Server reached, but shared storage is unavailable — ask your Trice admin (site storage must be enabled)');
    else if (r.status === 404) toast('Sync relay missing on this site — republish the FULL Trice package, every folder included');
    else toast(`Trice sync error ${r.status} — try again shortly`);
  } catch (e) { toast('No connection to the sync server — check signal; Trice retries automatically'); }
  render();
}
async function fullResync() {
  toast('Pulling everything from the server…');
  const before = S.trees.length, bp = S.projects.length;
  SYNC.last = 0; localStorage.setItem('trice_sync_last', '0');
  try { await syncNow(); } catch (e) {}
  const got = S.trees.length - before, gp = S.projects.length - bp;
  if (SYNC.status === 'ok') toast(`Server pull complete — ${got > 0 ? got + ' new record' + (got > 1 ? 's' : '') : 'no new records'}${gp > 0 ? `, ${gp} new project${gp > 1 ? 's' : ''}` : ''} · this device now holds everything the team logged`);
  else toast('Could not reach the server — check signal and try again');
  render();
}
async function refreshProjects() {
  toast('Syncing…');
  try { await syncNow(); toast('Up to date — projects & records shared across every device'); }
  catch (e) { toast('No signal — will keep retrying in the background'); }
  render();
}
function nameCard() {
  return `
  <div class="card" style="padding:26px 18px;text-align:center">
    <div style="display:flex;justify-content:center;margin-bottom:12px"><div class="logo" style="width:44px;height:44px"><span></span><span></span><span></span></div></div>

    <div class="field" style="margin-top:14px;text-align:left"><label>${knownUsers().length ? 'Or add a new name' : 'Your name'}</label><input id="obName" placeholder="Amy Cushman" value="${esc(S.surveyor)}" autocomplete="name"></div>
    <button class="btn primary" style="margin-top:14px" onclick="saveName()">Continue</button>
  </div>`;
}

    </div>

function detectionCard(r, i, total) {

  <div style="margin-top:14px">
    <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:8px">
      <span class="slab">${total > 1 ? `Tree ${i + 1} of ${total}` : 'Capture'} ${r.include ? `· logs as ${idPreview}` : ''}</span>
      ${total > 1 ? `<label style="display:flex;align-items:center;gap:7px;font-size:12px;font-weight:600;color:${r.include ? 'var(--ink)' : 'var(--faint)'}"><input type="checkbox" ${r.include ? 'checked' : ''} onchange="S.draft.results[${i}].include=this.checked;render()" style="width:17px;height:17px;accent-color:#c8452c">Include</label>` : ''}
    </div>

        <button onclick="openZoomDraft(${i})" style="display:block;width:100%;height:140px;position:relative;border:0;padding:0;background:#ecebe4;overflow:hidden"><img src="${r.crop}" alt="Tree ${i+1}" style="width:100%;height:100%;object-fit:cover;display:block"></button>
        <div style="padding:10px 14px;border-top:1px solid var(--hair);background:var(--soft);font-size:12px">${coord}</div>
      </div>` : `<div class="card" style="padding:10px 14px;font-size:12px;margin-bottom:10px">${coord}</div>`}
      ${r.include ? `
      <div class="card">
        <div class="slab" style="margin-bottom:8px">Hazard rating</div>
        ${hazButtons(i, r.hazard)}

        </div>
        <div class="field" style="margin-top:10px"><label>Cause of loss</label><select onchange="if(this.value==='Other…'){setDet(${i},'cause','')}else{setDet(${i},'cause',this.value)}">${CAUSES.map(c => `<option ${r.cause === c ? 'selected':''}>${c}</option>`).join('')}<option ${r.cause != null && !CAUSES.includes(r.cause) ? 'selected' : ''}>Other…</option></select>${r.cause != null && !CAUSES.includes(r.cause) ? `<input placeholder="Type the cause" value="${esc(r.cause)}" oninput="S.draft.results[${i}].cause=this.value" style="margin-top:8px;width:100%;border:1px solid var(--line);border-radius:12px;padding:11px 13px;background:#fff;color:var(--ink)">` : ''}</div>
        <div class="field" style="margin-top:10px"><label>Arborist note — photograph and talk</label>
          <textarea id="detnote${i}" placeholder="Findings, structure, treatment spec…" oninput="S.draft.results[${i}].notes=this.value">${esc(r.notes)}</textarea>${bigMic('detnote' + i)}
        </div>
      </div>
      ${r.ai ? aiCard(r, a) + `
      <details style="margin-top:8px;border:1px solid var(--line);border-radius:13px;background:#fff;padding:11px 14px"><summary style="font-size:12.5px;font-weight:700;color:var(--info);cursor:pointer">Adjust the AI read — species, size, recommendation</summary>
        <div style="display:grid;grid-template-columns:1.4fr 1fr 1fr;gap:8px;margin-top:10px">

function discardDraft() { if (!S.draft || confirm('Discard this capture?')) { S.draft = null; try { DB.setMeta('draft', null); } catch (e) {} render(); } }

/* ---- Rows ---- */

/* ---- Trees tab ---- */
function regFilter() {
  let list = S.trees.slice().reverse();
  const q = S.regQ.trim().toLowerCase();
  if (q) list = list.filter(t => { const a = t.ai || {}; return `${t.id} ${a.species||''} ${a.latin||''} ${t.zone||''} ${t.locDetails||''} ${t.cause||''} ${(a.action||'')}`.toLowerCase().includes(q); });
  if (S.regHaz !== 'all') list = S.regHaz === 'pending' ? list.filter(t => t.pending) : list.filter(t => t.hazard === S.regHaz);
  if (ADMIN() && S.regUser) list = list.filter(t => (t.surveyor || 'Unassigned') === S.regUser);
  return list;
}
function regRowsHTML() {
  const list = regFilter();
  if (!list.length) return `<div style="padding:26px 0;text-align:center;font-size:13px;color:var(--faint)">No assets match this filter.</div>`;
  const groups = {};
  for (const t of list) { const k = t.surveyor || 'Unassigned'; (groups[k] = groups[k] || []).push(t); }
  const filterOn = S.regQ.trim() !== '' || S.regHaz !== 'all';
  S.regOpen = S.regOpen || {};
  return Object.keys(groups).sort((a, b) => a === S.surveyor ? -1 : (b === S.surveyor ? 1 : a.localeCompare(b))).map(name => {
    const g = groups[name];
    const open = filterOn ? true : (S.regOpen[name] !== undefined ? S.regOpen[name] : name === S.surveyor);
    const hi = g.filter(t => t.hazard === 'High Hazard').length;
    const md = g.filter(t => t.hazard === 'Moderate').length;
    const cl = g.filter(t => t.hazard === 'Cleared').length;
    const key = name.replace(/'/g, "\\'");
    return `
    <div style="border-top:1px solid var(--hair)">
      <button onclick="toggleGroup('${esc(key)}')" style="display:flex;align-items:center;gap:10px;width:100%;background:none;border:0;padding:13px 0;text-align:left;color:var(--ink)">
        <span style="flex:1;min-width:0"><span style="display:block;font-size:13.5px;font-weight:700">${esc(name)}${name === S.surveyor ? ' <span style="font-weight:600;color:var(--faint)">· you</span>' : ''}</span>
        <span style="display:block;font-size:11px;color:var(--muted)">${g.length} asset${g.length > 1 ? 's' : ''}${hi ? ` · <span style="color:var(--bad);font-weight:700">${hi} high</span>` : ''}${md ? ` · <span style="color:var(--warn-ink);font-weight:700">${md} mod</span>` : ''}${cl ? ` · <span style="color:var(--good);font-weight:700">${cl} cleared</span>` : ''}</span></span>
        <span style="color:var(--faint);font-size:15px;display:inline-block;transform:rotate(${open ? 90 : 0}deg)">›</span>
      </button>
      ${open ? `<div style="padding-left:6px">${g.map(rowHTML).join('')}</div>` : ''}
    </div>`;
  }).join('');
}
function toggleGroup(name) {
  S.regOpen = S.regOpen || {};
  const cur = S.regOpen[name] !== undefined ? S.regOpen[name] : name === S.surveyor;
  S.regOpen[name] = !cur;
  const el = document.getElementById('regList'); if (el) el.innerHTML = regRowsHTML();
}
function adminRegBar() {

  return `
  <div class="card" style="margin-bottom:10px;border-color:#e8cfc9">

    <div style="display:flex;gap:6px;flex-wrap:wrap;margin-top:9px">
      <button onclick="S.regUser=null;render()" class="chip ${!S.regUser ? 'info' : ''}" style="border:1px solid ${!S.regUser ? 'transparent' : 'var(--line)'};background:${!S.regUser ? '' : '#fff'};${!S.regUser ? '' : 'color:var(--muted);'}padding:7px 12px">All assessors</button>
      ${us.map(u => { const k = u.replace(/'/g, "\\'"); const on = S.regUser === u; return `<button onclick="S.regUser='${esc(k)}';render()" class="chip ${on ? 'info' : ''}" style="border:1px solid ${on ? 'transparent' : 'var(--line)'};background:${on ? '' : '#fff'};${on ? '' : 'color:var(--muted);'}padding:7px 12px">${esc(u)}</button>`; }).join('')}
    </div>
    <div style="display:flex;gap:8px;margin-top:11px;align-items:center;flex-wrap:wrap">
      <select id="admMove" style="flex:1;min-width:150px;border:1px solid var(--line);border-radius:11px;padding:10px 12px;background:#fff;color:var(--ink)"><option value="">Move these ${list.length} to project…</option>${projs.map(p => `<option>${esc(p)}</option>`).join('')}</select>
      <button class="btn dark" style="width:auto;padding:10px 16px;flex:none" onclick="bulkMove()">Move</button>
      <button class="btn ghost" style="width:auto;padding:10px 16px;flex:none;color:var(--bad)" onclick="bulkDelete()">Delete ${list.length}</button>
    </div>
    <div style="margin-top:7px;font-size:11px;color:var(--faint)">Bulk actions apply to the current filter (search + hazard + assessor). Moves and deletes sync to every device; deletes need a double confirm.</div>
  </div>`;
}
async function bulkMove() {
  const sel = document.getElementById('admMove'); const p = sel && sel.value;
  if (!p) { toast('Pick a destination project'); return; }
  const list = regFilter();
  if (!list.length) return;
  for (const t of list) { t.site = p; markDirty(t); try { await DB.putTree(stripRuntime(t)); } catch (e) {} }
  toast(`${list.length} record${list.length > 1 ? 's' : ''} moved to ${p} — synced to the team`);
  render();
}
async function bulkDelete() {
  const list = regFilter();
  if (!list.length) return;
  if (!confirm(`Delete ${list.length} record${list.length > 1 ? 's' : ''} from the register?`)) return;
  if (!confirm('Really delete? This removes them for every device (a tombstone syncs). Export a backup first if unsure.')) return;
  const tb = tombs();
  for (const t of list) { try { await DB.delTree(t.id); } catch (e) {} tb.push(t.id); }
  localStorage.setItem('trice_tombs', JSON.stringify(tb));
  const ids = new Set(list.map(t => t.id));
  S.trees = S.trees.filter(t => !ids.has(t.id));
  queueSync();
  S.detailId = null; S.editId = null;
  toast(`${ids.size} deleted — register updated everywhere`);
  render();
}

  return `<div style="display:flex;gap:6px;flex-wrap:wrap;margin:10px 0">${c('all','All')}${c('High Hazard','▲ High Hazard','bad')}${c('Moderate','● Moderate','warn')}${c('Cleared','■ Cleared','good')}${c('pending','Pending','warn')}</div>`;

/* ---- Adjust pin ---- */
let adjMapObj = null, adjMarker = null;
function openAdjust(id) {
  const t = S.trees.find(x => x.id === id);
  if (t && typeof t.lat !== 'number') {
    const ref = S.trees.find(x => typeof x.lat === 'number' && siteOfT(x) === siteOfT(t)) || S.trees.find(x => typeof x.lat === 'number');
    if (!ref) { toast('No map anchor yet — log one GPS capture first, then place this pin'); return; }
    t._anchor = [ref.lat, ref.lng];
  }
  S.adjustId = id; render(); requestAnimationFrame(mountAdjustMap);
}
function mountAdjustMap() {
  const t = S.trees.find(x => x.id === S.adjustId); const el = document.getElementById('adjMap');
  if (!t || !el || typeof L === 'undefined') return;
  if (adjMapObj) { adjMapObj.remove(); adjMapObj = null; }
  const hasPos = typeof t.lat === 'number';
  const at = hasPos ? [t.lat, t.lng] : (t._anchor || null);
  if (!at) return;
  adjMapObj = L.map(el, { zoomControl: true, attributionControl: true }).setView(at, hasPos ? 19 : 17);
  baseLayer('sat').addTo(adjMapObj);
  adjMarker = L.marker(at, { draggable: true, icon: pinIcon(t) }).addTo(adjMapObj);
}
async function saveAdjust() {
  const t = S.trees.find(x => x.id === S.adjustId);
  if (t && adjMarker) {
    const p = adjMarker.getLatLng();
    t.lat = p.lat; t.lng = p.lng; t.posMethod = 'adjusted'; delete t._anchor; markDirty(t);
    try { await DB.putTree(stripRuntime(t)); } catch (e) {}
    toast(`${t.id} position verified on imagery`);
  }
  closeAdjust();
}
function closeAdjust() { if (adjMapObj) { adjMapObj.remove(); adjMapObj = null; adjMarker = null; } S.adjustId = null; render(); }
function adjustSheet(t) {
  return `
  <div class="sheet-scrim" onclick="closeAdjust()"></div>
  <div class="sheet">
    <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:10px"><span class="slab" style="color:var(--info);font-weight:700">Fine-tune ${t.id}</span><button onclick="closeAdjust()" style="border:0;background:none;font-size:20px;line-height:1;color:var(--muted)">×</button></div>
    <div style="font-size:12.5px;color:var(--muted);margin-bottom:10px">Drag the pin onto the tree’s canopy — coordinates are what defend the record.</div>
    <div id="adjMap"></div>
    <button class="btn dark" style="margin-top:12px" onclick="saveAdjust()">Save position</button>
  </div>`;
}

/* ---- Map: Red / Yellow / Green — the map is the task list ---- */
let leafletMap = null;
function baseLayer(kind) {
  if (kind === 'sat') return L.tileLayer('https://server.arcgisonline.com/ArcGIS/rest/services/World_Imagery/MapServer/tile/{z}/{y}/{x}', { maxZoom: 19, attribution: 'Imagery © Esri' });
  return L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', { maxZoom: 19, attribution: '© OpenStreetMap' });
}
function pinIcon(t) {
  const pending = t.pending && !t.ai;
  const haz = t.hazard || 'Moderate';
  const c = pending ? '#8a929b' : HAZ_INK(haz);
  const hi = haz === 'High Hazard' && !pending;
  const size = hi ? 34 : 26;
  const glyph = pending ? '?' : (hi ? '▲' : (haz === 'Cleared' ? '✓' : ''));
  const qty = (t.qty || 1) > 1 ? `<span class="qty">${t.qty}</span>` : '';
  return L.divIcon({ className: '', html: `<div class="pin2" style="width:${size}px;height:${size}px;background:${c};font-size:${hi ? 12 : 12.5}px">${glyph}${qty}</div>`, iconSize: [size, size], iconAnchor: [size / 2, size / 2] });
}
function mapUsers(src) {
  const m = {};
  for (const t of (src || S.trees).filter(x => typeof x.lat === 'number')) {
    const k = t.surveyor || 'Unassigned';
    if (!m[k]) m[k] = { n: 0 };
    m[k].n++;
  }
  return m;
}
function setMapUser(name) { S.mapUser = (S.mapUser === name || name === null) ? null : name; render(); }
function netCard() {
  const now = Date.now();
  const act = (S.usersMeta || []).filter(u => u && u.name && (now - (u.lastSeen || 0)) < 75000).sort((a, b) => a.name.localeCompare(b.name));
  return `
  <div class="slab" style="margin:18px 0 8px">On the network now</div>
  <div class="card" style="padding:${act.length ? '4px 15px' : '15px'}">
    ${act.length ? act.map((u, i) => `<div style="display:flex;align-items:center;gap:11px;padding:11px 0;${i ? 'border-top:1px solid var(--hair)' : ''}"><span style="width:10px;height:10px;border-radius:50%;background:var(--good);animation:adpulse 1.6s infinite;flex:none"></span><span style="flex:1;min-width:0;font-size:13.5px;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis">${esc(u.name)}${u.name === S.surveyor ? ' <span style="font-weight:500;color:var(--faint)">· you</span>' : ''}</span><span class="chip good">Live</span></div>`).join('') : `<div style="font-size:12.5px;color:var(--muted);line-height:1.55">No one is on right now. Teammates appear here with a live dot while their device is syncing — names only, never their location.</div>`}

}

function setBasemap(k) { S.basemap = k; localStorage.setItem('trice_basemap', k); render(); }
function setMapProject(p) { S.mapProject = p; S.mapUser = null; render(); }
function mountMap() {
