<style>
*{box-sizing:border-box}
:root{
  --ink:#17181a; --body:#403d37; --muted:#86837b; --faint:#a8a49a; --label:#98948a;
  --accent:#c8452c; --bg:#f3f1ec; --card:#fff; --line:#e7e4dc; --soft:#f7f5f0; --hair:#efece5;

}
html,body{height:100%}
html{-webkit-text-size-adjust:100%;text-size-adjust:100%}
body{margin:0;background:var(--bg);color:var(--ink);font-family:"Helvetica Neue",Helvetica,Arial,sans-serif;-webkit-font-smoothing:antialiased;line-height:1.5;font-size:14px;overscroll-behavior-y:contain}

*{-webkit-tap-highlight-color:transparent}

.nav button,.chip,.shutter,.hazbtn{-webkit-user-select:none;user-select:none}
input:focus,select:focus,textarea:focus{outline:none;border-color:var(--ink)}
::placeholder{color:var(--faint)}
button{cursor:pointer}
.mono{font-family:ui-monospace,"SF Mono",Menlo,monospace}
@keyframes fadeUp{from{opacity:0;transform:translateY(10px) scale(.97)}to{opacity:1;transform:translateY(0) scale(1)}}
@keyframes adpulse{0%,100%{opacity:.2}50%{opacity:1}}
@keyframes sheetup{from{transform:translateY(30px);opacity:0}to{transform:translateY(0);opacity:1}}
@keyframes spin{to{transform:rotate(360deg)}}
@media (prefers-reduced-motion:reduce){*{animation-duration:.01ms !important;transition-duration:.01ms !important}}

body{overflow-x:hidden}
#app{max-width:520px;margin:0 auto;overflow-x:hidden;min-width:0;min-height:100vh;min-height:100dvh;display:flex;flex-direction:column;background:var(--bg)}

.backmap{border:0;border-radius:999px;background:rgba(255,255,255,.14);color:#fff;font-size:12.5px;font-weight:700;padding:9px 16px;display:inline-flex;align-items:center;gap:7px;backdrop-filter:blur(6px)}

<script>
'use strict';
/* ============================================================
   Trice × WTR — Field & Consulting App (tree module) v10
   v10: the AI key lives ONLY in the host environment (server side);
   all AI calls stream through /api/analyze. Color coding removed. XLSX fixed.
   Built to the V5 Field Data Collection Specification (11 Aug 2026)
   and the WTR operating summary. Capture stays rapid: three
   hazard buttons, four failure types, auto GPS+timestamp,
   voice notes. The map is the task list — Cleared flips it green.
   ============================================================ */

/* ---------------- V5 vocabulary ---------------- */
const HAZARDS = ['High Hazard', 'Moderate', 'Cleared'];
const HAZ_INK = h => h === 'High Hazard' ? '#b34b48' : (h === 'Moderate' ? '#b8842a' : '#2f7d55');
const HAZ_TONE = h => h === 'High Hazard' ? 'bad' : (h === 'Moderate' ? 'warn' : 'good');
const CAUSES = ['Windthrow','Trunk Shear','Torsion','Windthrow / Trunk Shear','Root Plate Failure','Limb Failure / Hanger','Crown Loss','Lightning Strike','Flood / Saturation','Storm Surge / Salt Intrusion','Decay / Structural Defect','Pest / Disease','Pre-Existing — Not Event Related','Undetermined'];
const FAILURES = ['Canopy Torsion','Root Plate Shear','Branch Hanger','Trunk Shear'];
const DISPOSALS = ['','On-site Chipper','Haul-off','On-site Mulch / Stockpile','On-site Burn (where permitted)','Client Disposal','Log Salvage / Milling','Leave in Place','Not Applicable'];
const STUMPS = ['','Grind below grade','Grind 12 in below grade','Grind 6 in below grade','Flush cut','Full excavation','Leave in place','Not Applicable'];
const ASSESS_TYPES = ['Routine Canopy Inventory','Pre-Loss Inspection','Post-Loss Assessment','Storm Response','Pre-Acquisition Inspection','Forensic Claim Audit'];
const DBH_BAND = d => { d = parseFloat(d); if (!isFinite(d) || d <= 0) return ''; if (d < 6) return '<6 in'; if (d < 12) return '6-12 in'; if (d < 18) return '12-18 in'; if (d < 24) return '18-24 in'; if (d < 36) return '24-36 in'; return '36+ in'; };
const DBH_BANDS = ['<6 in','6-12 in','12-18 in','18-24 in','24-36 in','36+ in'];
const HEALTH_INK = h => h >= 80 ? '#2f7d55' : (h >= 55 ? '#b8842a' : '#b34b48');
const HFOV = 64;
const esc = s => String(s == null ? '' : s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const money = n => { n = parseFloat(n); return isFinite(n) ? '$' + n.toLocaleString('en-US', { maximumFractionDigits: 0 }) : '—'; };
const num = v => { const n = parseFloat(v); return isFinite(n) ? n : 0; };
const lineTotal = t => num(t.prune) + num(t.removal) + num(t.disposal) + num(t.stump);
/* Predicted line total — what the line WOULD price at if the amber prediction were accepted. */
const predTotal = t => { const p = t.pred || {}; return num(t.prune ?? p.prune) + num(t.removal ?? p.removal) + num(t.disposal ?? p.disposal) + num(t.stump ?? p.stump); };
const hasPred = t => !!(t.pred && (t.pred.prune != null || t.pred.removal != null || t.pred.disposal != null || t.pred.stump != null));
const fmtWhen = ts => { const d = new Date(ts); const mo = d.toLocaleString('en-US',{month:'short'}); let h = d.getHours(), ap = h >= 12 ? 'pm':'am'; h = h % 12 || 12; return `${mo} ${d.getDate()} · ${h}:${String(d.getMinutes()).padStart(2,'0')}${ap}`; };
const isoWhen = ts => { const d = new Date(ts); const p = n => String(n).padStart(2,'0'); return `${d.getFullYear()}-${p(d.getMonth()+1)}-${p(d.getDate())} ${p(d.getHours())}:${p(d.getMinutes())}`; };
const fmtCoord = (n, dp=5) => (typeof n === 'number' && isFinite(n)) ? n.toFixed(dp) : '—';
const gpsCell = t => (typeof t.lat === 'number') ? `${t.lat.toFixed(4)}, ${t.lng.toFixed(4)}` : '';

function destPoint(lat, lng, brgDeg, distM) {
  const R = 6371000, d = distM / R, br = brgDeg * Math.PI/180;
  const p1 = lat * Math.PI/180, l1 = lng * Math.PI/180;
  const p2 = Math.asin(Math.sin(p1)*Math.cos(d) + Math.cos(p1)*Math.sin(d)*Math.cos(br));
  const l2 = l1 + Math.atan2(Math.sin(br)*Math.sin(d)*Math.cos(p1), Math.cos(d) - Math.sin(p1)*Math.sin(p2));
  return { lat: p2*180/Math.PI, lng: ((l2*180/Math.PI) + 540) % 360 - 180 };
}
const fmtBearing = b => { const dirs=['N','NNE','NE','ENE','E','ESE','SE','SSE','S','SSW','SW','WSW','W','WNW','NW','NNW']; return `${Math.round(b)}° ${dirs[Math.round(((b%360)+360)%360/22.5)%16]}`; };
const havM = (la1, lo1, la2, lo2) => { const R = 6371000, dLa = (la2-la1)*Math.PI/180, dLo = (lo2-lo1)*Math.PI/180, a = Math.sin(dLa/2)**2 + Math.cos(la1*Math.PI/180)*Math.cos(la2*Math.PI/180)*Math.sin(dLo/2)**2; return 2*R*Math.asin(Math.sqrt(a)); };
/* C11 — the "instant geofenced PDF": stamp where the report was generated relative to the surveyed assets */
function geofenceStamp() {
  const g = S.gpsWatch;
  const pts = S.trees.filter(t => typeof t.lat === 'number');
  if (!g.ok) return 'Report generated without a live GPS fix at time of generation.';
  const here = `${g.lat.toFixed(5)}, ${g.lng.toFixed(5)} (±${Math.round(g.acc)} m)`;
  if (!pts.length) return `Report generated at ${here}.`;
  const dmin = Math.round(Math.min(...pts.map(t => havM(g.lat, g.lng, t.lat, t.lng))));
  return dmin <= 500
    ? `GEOFENCE-VERIFIED — report generated on site at ${here}, within ${dmin} m of the nearest surveyed asset.`
    : `Report generated off site at ${here}, ${(dmin/1000).toFixed(1)} km from the nearest surveyed asset.`;
}

/* ---------------- IndexedDB ---------------- */
const DB = (() => {
  let db;
  const open = () => new Promise((res, rej) => {
    if (db) return res(db);
    const rq = indexedDB.open('trice-survey', 1);
    rq.onupgradeneeded = () => { const d = rq.result; if (!d.objectStoreNames.contains('trees')) d.createObjectStore('trees', { keyPath: 'id' }); if (!d.objectStoreNames.contains('meta')) d.createObjectStore('meta', { keyPath: 'k' }); };
    rq.onsuccess = () => { db = rq.result; res(db); };
    rq.onerror = () => rej(rq.error);
  });
  const tx = async (store, mode, fn) => { const d = await open(); return new Promise((res, rej) => { const t = d.transaction(store, mode); fn(t.objectStore(store)); t.oncomplete = () => res(); t.onerror = () => rej(t.error); }); };
  return {
    allTrees: async () => { const d = await open(); return new Promise((res, rej) => { const rq = d.transaction('trees').objectStore('trees').getAll(); rq.onsuccess = () => res(rq.result || []); rq.onerror = () => rej(rq.error); }); },
    putTree: t => tx('trees', 'readwrite', s => s.put(t)),
    delTree: id => tx('trees', 'readwrite', s => s.delete(id)),
    getMeta: async k => { const d = await open(); return new Promise((res) => { const rq = d.transaction('meta').objectStore('meta').get(k); rq.onsuccess = () => res(rq.result ? rq.result.v : null); rq.onerror = () => res(null); }); },
    setMeta: (k, v) => tx('meta', 'readwrite', s => s.put({ k, v })),
  };
})();

/* ---------------- State ---------------- */
const S = {
  tab: 'survey',
  site: localStorage.getItem('trice_site') || '',
  surveyor: localStorage.getItem('trice_surveyor') || '',
  basemap: localStorage.getItem('trice_basemap') || 'streets',
  job: (() => { try { return JSON.parse(localStorage.getItem('trice_job') || '{}'); } catch (e) { return {}; } })(),
  execRead: localStorage.getItem('trice_read') || '',
  regQ: '', regHaz: 'all', regUser: null, repUser: null,
  mapProject: null, repProject: null,
  users: (() => { try { return JSON.parse(localStorage.getItem('trice_users') || '[]'); } catch (e) { return []; } })(),
  repSecs: (() => { try { return JSON.parse(localStorage.getItem('trice_repsecs') || '{}'); } catch (e) { return {}; } })(),
  repViz: (() => { try { return JSON.parse(localStorage.getItem('trice_repviz') || '{"hazmix":true,"zone":true}'); } catch (e) { return { hazmix: true, zone: true }; } })(),
  usersMeta: [],
  emp: (() => { try { return JSON.parse(localStorage.getItem('trice_emp') || '{}'); } catch (e) { return {}; } })(),
  subs: (() => { try { return JSON.parse(localStorage.getItem('trice_subs') || '{}'); } catch (e) { return {}; } })(),
  subsDirty: {},
  predAdjust: (() => { try { return localStorage.getItem('trice_predadjust') || ''; } catch (e) { return ''; } })(),
  projState: (() => { try { return JSON.parse(localStorage.getItem('trice_projstate') || '{}'); } catch (e) { return {}; } })(),
  projStateDirty: {},
  assign: (() => { try { return JSON.parse(localStorage.getItem('trice_assign') || '{}'); } catch (e) { return {}; } })(),
  hoursMap: (() => { try { return JSON.parse(localStorage.getItem('trice_hours') || '{}'); } catch (e) { return {}; } })(),
  empDirty: {}, assignDirty: {}, hoursDirty: {}, budgetDirty: {},
  budgets: (() => { try { return JSON.parse(localStorage.getItem('trice_budgets') || '{}'); } catch (e) { return {}; } })(),
  teamSec: 'perf',
  deletedProjects: (() => { try { return JSON.parse(localStorage.getItem('trice_delproj') || '[]'); } catch (e) { return []; } })(),
  archivedProjects: (() => { try { return JSON.parse(localStorage.getItem('trice_archproj') || '[]'); } catch (e) { return []; } })(),
  teamWeek: 0,
  admin: localStorage.getItem('trice_admin') === '1',
  projects: (() => { try { return JSON.parse(localStorage.getItem('trice_projects') || '[]'); } catch (e) { return []; } })(),
  projectParents2: (() => {
    try {
      const v2 = JSON.parse(localStorage.getItem('trice_parents2') || 'null');
      if (v2) return v2;
      const v1 = JSON.parse(localStorage.getItem('trice_parents') || '{}');
      const o = {}; for (const [c, p] of Object.entries(v1)) o[c] = { p, at: 1 };
      return o;
    } catch (e) { return {}; }
  })(),
  readBusy: false,
  trees: [], seq: 1,
  draft: null,
  detailId: null, editId: null, adjustId: null,
  zoomSrc: null, zoomMeta: null, zoomFromMap: false, mapUser: null, projectId: null, repOpen: {},
  camOpen: false, showCheck: false, check: null, caps: null,
  lastZone: localStorage.getItem('trice_lastzone') || '',
  gpsWatch: { lat: null, lng: null, acc: null, ok: false },
};
/* job fields: propCode, address, town, county, operator, superintendent, phone,
   clientRep, clientRepTitle, assessType, stormName, dateOfLoss, weather,
   carrier, policy, claim, adjuster, assessorCert, exposure */

let toastTimer = null;
function toast(msg, ms) {
  document.querySelectorAll('.toast').forEach(e => e.remove());
  const el = document.createElement('div'); el.className = 'toast'; el.textContent = msg; document.body.appendChild(el);
  clearTimeout(toastTimer); toastTimer = setTimeout(() => el.remove(), ms || 3000);
}

/* ---------------- GPS ---------------- */
let gpsWatchId = null;
function startGPS() {
  if (!navigator.geolocation || gpsWatchId != null) return;
  gpsWatchId = navigator.geolocation.watchPosition(p => {
    S.gpsWatch = { lat: p.coords.latitude, lng: p.coords.longitude, acc: p.coords.accuracy, ok: true };
    const el = document.getElementById('gpsLive'); if (el) el.outerHTML = gpsChip();
    const c = document.getElementById('camGps'); if (c) c.textContent = `GPS ±${Math.round(p.coords.accuracy)} m`;
  }, () => { S.gpsWatch.ok = false; }, { enableHighAccuracy: true, maximumAge: 3000, timeout: 15000 });
}
function gpsChip() {
  const g = S.gpsWatch;
  if (g.ok) return `<span id="gpsLive" class="chip good" style="display:inline-flex;align-items:center;gap:6px"><span style="width:6px;height:6px;border-radius:50%;background:#2f7d55;animation:adpulse 1.6s infinite"></span>GPS lock · ±${Math.round(g.acc)} m</span>`;
  return `<span id="gpsLive" class="chip warn">Waiting for GPS…</span>`;
}

/* ---------------- Compass ---------------- */
const compass = { deg: null, attached: false };
function attachCompass() {
  if (compass.attached) return; compass.attached = true;
  window.addEventListener('deviceorientation', e => {
    if (typeof e.webkitCompassHeading === 'number' && !isNaN(e.webkitCompassHeading)) { compass.deg = e.webkitCompassHeading; compassUI(); }
  }, true);
  window.addEventListener('deviceorientationabsolute', e => {
    if (e.absolute && typeof e.alpha === 'number') { compass.deg = (360 - e.alpha) % 360; compassUI(); }
  }, true);
}
function requestCompass() {
  try {
    if (typeof DeviceOrientationEvent !== 'undefined' && typeof DeviceOrientationEvent.requestPermission === 'function') {
      DeviceOrientationEvent.requestPermission().then(s => { if (s === 'granted') attachCompass(); }).catch(() => {});
    } else attachCompass();
  } catch (e) {}
}
function compassUI() {
  const el = document.getElementById('camHeading');
  if (el && compass.deg != null) el.textContent = fmtBearing(compass.deg);
}

/* ---------------- Voice notes (the "photograph and talk" constraint) ---------------- */
let recog = null;
function micInto(id) {
  const SR = window.SpeechRecognition || window.webkitSpeechRecognition;
  if (!SR) { toast('Tap the field, then use the keyboard mic to dictate'); const el = document.getElementById(id); if (el) el.focus(); return; }
  if (recog) { try { recog.stop(); } catch (e) {} recog = null; return; }
  recog = new SR(); recog.lang = 'en-US'; recog.interimResults = false; recog.continuous = false;
  recog.onresult = e => {
    const text = Array.from(e.results).map(r => r[0].transcript).join(' ').trim();
    const el = document.getElementById(id);
    if (el && text) { el.value = (el.value ? el.value.replace(/\s+$/,'') + ' ' : '') + text; el.dispatchEvent(new Event('input')); }
  };
  recog.onend = () => { recog = null; };
  recog.onerror = () => { recog = null; };
  try { recog.start(); toast('Listening… tap mic again to stop'); } catch (e) { recog = null; }
}

/* ---------------- Live camera ---------------- */
let camStream = null;
let wakeLock = null;
async function holdScreenAwake() { try { if ('wakeLock' in navigator && !wakeLock) { wakeLock = await navigator.wakeLock.request('screen'); wakeLock.addEventListener('release', () => { wakeLock = null; }); } } catch (e) {} }
function releaseScreen() { try { if (wakeLock) { wakeLock.release(); wakeLock = null; } } catch (e) {} }
document.addEventListener('visibilitychange', () => { if (document.visibilityState === 'visible' && S.camOpen) holdScreenAwake(); });

/* ---------------- Team layer: shared sync ----------------
   Every phone pushes its records to /api/sync (a tiny function that ships
   in the same Trice package) and pulls everyone else's. Merge is
   last-write-wins per record; deletions travel as tombstones. If the host
   has no function (local file, plain static server) the app detects it and
   stays device-only with the existing backup/merge flow. */
const SYNC = { enabled: null, last: parseInt(localStorage.getItem('trice_sync_last')||'0',10), status:'idle', lastOk:null, timer:null, pushTimer:null };
function tombs(){ try { return JSON.parse(localStorage.getItem('trice_tombs')||'[]'); } catch(e){ return []; } }
function markDirty(t){ t.updated = Date.now(); t.dirty = true; queueSync(); }
function queueSync(){ clearTimeout(SYNC.pushTimer); SYNC.pushTimer = setTimeout(syncNow, 2500); }
function mergeRemote(list, dels){
  let changed=false;
  for(const rt of (list||[])){
    const i=S.trees.findIndex(t=>t.id===rt.id);
    if(i<0){ S.trees.push(rt); try{DB.putTree(rt);}catch(e){} changed=true; }
    else if((rt.updated||0) > (S.trees[i].updated||0) && !S.trees[i].dirty){ S.trees[i]=rt; try{DB.putTree(rt);}catch(e){} changed=true; }
  }
  for(const id of (dels||[])){
    const i=S.trees.findIndex(t=>t.id===id);
    if(i>=0 && !S.trees[i].dirty){ S.trees.splice(i,1); try{DB.delTree(id);}catch(e){} changed=true; }
  }
  if(changed){ S.trees.sort((a,b)=>a.id<b.id?-1:1); render(); }
  return changed;
}

/* ---------------- Fresh start — nothing is lost ----------------
   Wiping the shared register archives it twice first: permanently on the
   server, and on every phone (Report → Data → Download last archived job).
   Other phones pick up the reset signal on their next sync cycle. */
async function applyRemoteReset(resetAt) {
  try {
    if (S.trees.length) {
      await DB.setMeta('lastArchive', { at: Date.now(), site: S.site, trees: S.trees.map(stripRuntime) });
      for (const t of S.trees) { try { await DB.delTree(t.id); } catch (e) {} }
    }
    const unsynced = S.trees.filter(t => t.dirty);
    S.trees = unsynced;
    for (const t of unsynced) { t.photoSent = null; t.photoKey = null; try { await DB.putTree(stripRuntime(t)); } catch (e) {} }
    if (!unsynced.length) S.seq = 1; try { await DB.setMeta('seq', 1); } catch (e) {}
    localStorage.setItem('trice_tombs', '[]');
    SYNC.last = 0; localStorage.setItem('trice_sync_last', '0');
    localStorage.setItem('trice_reset_seen', String(resetAt));
    S.detailId = null; S.editId = null;
    toast('The team started a fresh register — your previous work is archived here and on the server');
    render();
  } catch (e) {}
}
async function startFresh() {
  if (!confirm('Start a fresh register for everyone?\n\nCurrent work is saved first: archived permanently on the server, kept on each phone (Data → Download last archived job), and a backup file downloads to this phone now.')) return;
  try { if (S.trees.length) exportJSON(); } catch (e) {}
  const stamp = Date.now();
  try {
    if (S.trees.length) await DB.setMeta('lastArchive', { at: stamp, site: S.site, trees: S.trees.map(stripRuntime) });
  } catch (e) {}
  let serverOk = false;
  if (navigator.onLine) {
    try {
      const r = await fetch('/api/sync', { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ reset: true, resetKey: 'trice-reset-2026' }) });
      if (r.ok) { const j = await r.json(); localStorage.setItem('trice_reset_seen', String(j.resetAt || stamp)); SYNC.last = 0; localStorage.setItem('trice_sync_last', '0'); serverOk = true; }
    } catch (e) {}
  }
  for (const t of S.trees) { try { await DB.delTree(t.id); } catch (e) {} }
  S.trees = []; S.seq = 1; try { await DB.setMeta('seq', 1); } catch (e) {}
  localStorage.setItem('trice_tombs', '[]');
  S.detailId = null; S.editId = null; S.regOpen = {};
  toast(serverOk ? 'Fresh register started for the whole team — old job archived' : 'Fresh register on this phone — server not reached; other phones keep their copies');
  render();
}
async function downloadArchive() {
  const a = await DB.getMeta('lastArchive').catch(() => null);
  if (!a || !a.trees || !a.trees.length) { toast('No archived job on this phone'); return; }
  download(`trice-archived-job-${new Date(a.at).toISOString().slice(0,10)}.json`, 'application/json',
    JSON.stringify({ v: 2, site: a.site || '', archivedAt: a.at, seq: 1, trees: a.trees }));
}


/* ---------------- Team backups (server snapshots) ---------------- */

/* ---------------- Force refresh this device ----------------
   Clears every cached layer (app shell, offline loader, local synced copies,
   sync watermark) and reloads fresh from the server. Unsynced work is pushed
   first and always kept. */
async function forceRefreshDevice() {
  let dirty = S.trees.filter(t => t.dirty);
  if (dirty.length && navigator.onLine) { toast('Pushing ' + dirty.length + ' unsynced record' + (dirty.length > 1 ? 's' : '') + ' first…'); try { await syncNow(); } catch (e) {} }
  dirty = S.trees.filter(t => t.dirty);
  if (dirty.length && !confirm(dirty.length + ' record(s) still have not reached the server. They stay safe on this device either way. Refresh now?')) return;
  if (!dirty.length && !confirm('Clear this device\u2019s cached app and data copies, then re-pull everything from the server?')) return;
  const keep = S.trees.filter(t => t.dirty);
  for (const t of S.trees) { if (!t.dirty) { try { await DB.delTree(t.id); } catch (e) {} } }
  S.trees = keep;
  localStorage.setItem('trice_sync_last', '0');
  try { if ('serviceWorker' in navigator) { const regs = await navigator.serviceWorker.getRegistrations(); for (const r of regs) { try { await r.unregister(); } catch (e) {} } } } catch (e) {}
  try { if (window.caches) { const ks = await caches.keys(); for (const k of ks) { try { await caches.delete(k); } catch (e) {} } } } catch (e) {}
  toast('Cleared — reloading fresh from the server…');
  setTimeout(() => location.reload(), 700);
}

async function openBackups() {
  S.backups = { loading: true, list: null }; render();
  try {
    const r = await fetch('/api/sync?list=backups');
    const j = await r.json();
    S.backups = { loading: false, list: j.backups || [] };
  } catch (e) { S.backups = { loading: false, list: null, err: true }; }
  render();
}
async function downloadTeamBackup(key) {
  try {
    toast('Fetching ' + key + '…');
    const r = await fetch('/api/sync?download=' + encodeURIComponent(key));
    if (!r.ok) throw new Error('http ' + r.status);
    const j = await r.json();
    const trees = j.trees ? Object.values(j.trees) : [];
    const projects = j.projects ? (Array.isArray(j.projects) ? j.projects : Object.keys(j.projects)) : [];
    download('trice-' + key + '.json', 'application/json',
      JSON.stringify({ v: 2, site: '', archivedAt: j.at || Date.now(), seq: 1, projects, trees }));
    toast(trees.length + ' records saved — move this file off the phone for a true offsite copy');
  } catch (e) { toast('Could not fetch that backup — check signal'); }
}
function backupsSheet() {
  const b = S.backups || {};
  return `
  <div class="sheet-scrim" onclick="S.backups=null;render()"></div>
  <div class="sheet">
    <div style="display:flex;justify-content:space-between;align-items:center;gap:10px">
      <div><div class="slab" style="color:var(--info);font-weight:700">Team backups</div><div style="font-size:12px;color:var(--muted);margin-top:3px">The server snapshots all team data daily, and archives every reset. Download a copy and move it off the phone — that file is the true offsite backup.</div></div>
      <button onclick="S.backups=null;render()" style="border:0;background:none;font-size:22px;line-height:1;color:var(--muted);width:44px;height:44px;flex:none">×</button>
    </div>

/* ---------------- Crop ---------------- */
function cropFromDataUrl(dataUrl, bbox) {
  return new Promise(res => {
    const img = new Image();
    img.onload = () => {
      const pad = 0.06;
      let x = Math.max(0, (bbox.x - pad)) * img.width;
      let y = Math.max(0, (bbox.y - pad)) * img.height;
      let w = Math.min(1 - Math.max(0, bbox.x - pad), bbox.w + pad*2) * img.width;
      let h = Math.min(1 - Math.max(0, bbox.y - pad), bbox.h + pad*2) * img.height;
      if (w < 40 || h < 40) { res(dataUrl); return; }
      const c = document.createElement('canvas'); c.width = Math.round(w); c.height = Math.round(h);
      c.getContext('2d').drawImage(img, x, y, w, h, 0, 0, c.width, c.height);
      res(c.toDataURL('image/jpeg', 0.85));
    };
    img.onerror = () => res(dataUrl);
    img.src = dataUrl;
  });
}

const AI_SYSTEM = `You are a board-certified master arborist (ISA BCMA) performing rapid visual tree assessments to TRAQ methodology from a single field photo, feeding the WTR field data schema. You are also the vision system: localize each distinct assessable tree and estimate its distance from the camera using scale cues (trunk diameter vs. known objects, ground plane, people, carts, light poles).

SPECIES IDENTIFICATION PROTOCOL
- Use the GPS coordinates provided to infer the region and weight species priors to that region's flora before naming anything.
- Identify from bark texture, branching architecture, leaf/frond form, crown shape, and trunk taper. If species is uncertain, give the genus confidently and say so ("Oak (Quercus sp.)") rather than guessing a species. Confidence must reflect real uncertainty.

BROADLEAF / CONIFER ASSESSMENT (VTA)
- Look for: fungal fruiting bodies at the root collar or trunk (Ganoderma, Armillaria, Inonotus), cavities, cracks, seams, included bark at codominant unions, deadwood proportion, canopy dieback percentage and pattern, epicormic sprouting (stress signal), lean with soil heave or root-plate lift, girdling roots, previous topping cuts, hangers.

PALMS ARE NOT TREES — ASSESS THEM AS PALMS
- No DBH-based decay logic; a palm has one growing point. Assess: canopy fullness (number of green fronds vs. expected for the species), frond discoloration patterns (uniform oldest-frond yellowing = potassium deficiency; new-growth deformity/frizzle top = manganese/boron; rapid uniform browning = lethal bronzing/lethal yellowing — flag as urgent), Ganoderma conk at the base (unsalvageable — recommend removal), pencil-pointing of the trunk, nutrient banding, and whether the bud/spear appears intact. Never call normal boot/leaf-base texture on a palm trunk "decay."

SCALE & MEASUREMENT PROTOCOL
- Anchor every size estimate to a visible reference before trusting instinct: people (~5.5–6 ft), golf flagsticks (7–8 ft), golf carts (~4 ft tall, 8 ft long), fences (~4 ft), doors (6.7 ft), vehicles, cart paths (~7 ft wide), bunker rakes (~5 ft). Name what you used in "scale_reference"; with no reference, derive scale from the trunk's angular size and your distance estimate and say so ("angular size at ~18 m").
- Work the geometry: estimate camera-to-trunk distance from the ground plane first, then height from how much of the frame the tree spans at that distance. A tree filling the vertical frame at 20 m is ~45–60 ft, not 25.
- DBH: read trunk width at ~4.5 ft above the base against your reference and distance. Mature canopy trees on maintained golf turf are rarely under 18″ DBH — do not default to nursery-stock sizes. Single-photo errors are almost always UNDERESTIMATES: when torn between two numbers, take the larger unless the reference says otherwise.
- Sanity-check the trio: height, DBH and crown spread must be plausible together for the species; state honest ± ranges in findings when the reference is weak.

- The "why" is 1-2 sentences in first-person working-arborist voice, naming the deciding observation.

/* Reads a response from /api/analyze — either plain JSON or a streamed SSE relay. */
async function readClaudeText(resp) {
  const ct = resp.headers.get('content-type') || '';
  if (ct.includes('text/html')) { const e = new Error("Trice AI relay is offline on this site — ask your admin to republish the full Trice package."); e.aiOff = true; throw e; }
  if (!ct.includes('event-stream')) {
    const data = await resp.json();
    return (data.content || []).filter(b => b.type === 'text').map(b => b.text).join('\n');
  }
  const rd = resp.body.getReader(), dec = new TextDecoder();
  let buf = '', out = '';
  for (;;) {
    const { done, value } = await rd.read(); if (done) break;
    buf += dec.decode(value, { stream: true });
    const lines = buf.split('\n'); buf = lines.pop();
    for (const ln of lines) {
      if (!ln.startsWith('data:')) continue;
      const s = ln.slice(5).trim(); if (!s) continue;
      let ev; try { ev = JSON.parse(s); } catch (e) { continue; }
      if (ev.type === 'content_block_delta' && ev.delta && typeof ev.delta.text === 'string') out += ev.delta.text;
      else if (ev.type === 'error') throw new Error((ev.error && ev.error.message) || 'The analysis stream failed — try again.');
    }
  }
  return out;
}

async function callClaude(dataUrl, zone, coords) {
  const b64 = dataUrl.split(',')[1];
  let resp;
  try {
    resp = await fetch('/api/analyze', {
    method: 'POST', headers: { 'Content-Type': 'application/json' },
    body: JSON.stringify({
      max_tokens: 2200, system: AI_SYSTEM,
      messages: [{ role: 'user', content: [
        { type: 'image', source: { type: 'base64', media_type: 'image/jpeg', data: b64 } },
        { type: 'text', text: aiPrompt(zone, S.site, coords) + correctionsDigest() }
      ]}]
    })
  });
  } catch (netErr) {
    throw new Error("Couldn't reach Trice. Check signal and retry — the capture is saved either way.");
  }
  if (!resp.ok) {
    if (resp.status === 503) { const e = new Error("Trice AI isn't switched on for this site yet — ask your Trice admin. The capture is saved either way."); e.aiOff = true; throw e; }
    if (resp.status === 404) { const e = new Error("Trice AI relay is offline on this site — ask your admin to republish the full Trice package."); e.aiOff = true; throw e; }
    if (resp.status === 401 || resp.status === 403) throw new Error("Trice AI credentials were rejected — ask your Trice admin to re-check the site setup.");
    throw new Error(`Trice analysis error (${resp.status}). Try again in a moment.`);
  }
  const text = await readClaudeText(resp);
  const clean = text.replace(/```json|```/g, '').trim();
  const start = clean.indexOf('{'), end = clean.lastIndexOf('}');
  if (start < 0 || end < 0) throw new Error('The model returned an unreadable result. Try again.');
  const j = JSON.parse(clean.slice(start, end + 1));
  if (j.error) throw new Error(j.error);
  let arr = Array.isArray(j.trees) ? j.trees : [j];
  arr = arr.slice(0, 4).map(a => {
    a.health = Math.max(0, Math.min(100, parseInt(a.health, 10) || 0));
    a.confidence = Math.max(0, Math.min(100, parseInt(a.confidence, 10) || 0));
    if (!HAZARDS.includes(a.hazard)) a.hazard = a.health >= 80 ? 'Cleared' : (a.health >= 55 ? 'Moderate' : 'High Hazard');
    if (!CAUSES.includes(a.cause)) a.cause = 'Undetermined';
    a.failures = Array.isArray(a.failures) ? a.failures.filter(f => FAILURES.includes(f)) : [];
    a.findings = Array.isArray(a.findings) ? a.findings.slice(0, 4) : [];
    a.qty = Math.max(1, Math.min(50, parseInt(a.qty, 10) || 1));
    a.dbh_in = Math.max(0, Math.min(200, parseInt(a.dbh_in, 10) || 0)) || null;
    a.height_ft = Math.max(0, Math.min(200, parseInt(a.height_ft, 10) || 0)) || null;
    a.scale_reference = typeof a.scale_reference === 'string' ? a.scale_reference.slice(0, 90) : '';
    a.distance_m = Math.max(1, Math.min(200, parseInt(a.distance_m, 10) || 0)) || null;
    const b = a.bbox || {};
    a.bbox = { x: clamp01(b.x), y: clamp01(b.y), w: clamp01(b.w) || 1, h: clamp01(b.h) || 1 };
    return a;
  });
  if (!arr.length) throw new Error('No tree detected in this photo.');
  return arr;
}
const clamp01 = v => { v = parseFloat(v); return isFinite(v) ? Math.max(0, Math.min(1, v)) : 0; };

/* The app learns from its users: signed overrides feed the next analysis as calibration. */
function correctionsDigest() {
  const cs = S.trees.filter(t => t.reviewed && t.aiOriginal).slice(-12).map(t => {
    const o = t.aiOriginal || {}, d = [];
    if (o.species && t.ai && t.ai.species && o.species !== t.ai.species) d.push(`species ${o.species} → ${t.ai.species}`);
    if (o.dbh_in != null && t.dbhIn != null && o.dbh_in !== t.dbhIn) d.push(`DBH ${o.dbh_in}″ → ${t.dbhIn}″`);
    if (o.height_ft != null && t.heightFt != null && o.height_ft !== t.heightFt) d.push(`height ${o.height_ft} → ${t.heightFt} ft`);
    if (o.hazard && t.hazard && o.hazard !== t.hazard) d.push(`hazard ${o.hazard} → ${t.hazard}`);
    if (o.action && t.ai && t.ai.action && o.action !== t.ai.action) d.push(`recommendation "${o.action}" → "${t.ai.action}"`);
    return d.length ? `- ${d.join('; ')}` : null;

}

function positionTree(d, det) {
  const camOk = typeof d.camLat === 'number';
  if (!camOk) return { lat: null, lng: null, method: 'none' };
  if (typeof d.heading === 'number' && det.ai.distance_m) {
    const xC = det.ai.bbox.x + det.ai.bbox.w / 2;
    const bearing = ((d.heading + (xC - 0.5) * HFOV) % 360 + 360) % 360;
    const p = destPoint(d.camLat, d.camLng, bearing, det.ai.distance_m);
    return { lat: p.lat, lng: p.lng, method: 'offset', bearing, dist: det.ai.distance_m };

function recomputeDraftPositions() {

      d.results.forEach((r, i) => {
        const b = (r.ai && r.ai.bbox) || {};
        const inside = 0.5 >= b.x && 0.5 <= b.x + b.w && 0.5 >= b.y && 0.5 <= b.y + b.h;
        const dist = Math.hypot(b.x + b.w / 2 - 0.5, b.y + b.h / 2 - 0.5) - (inside ? 1 : 0);
        if (dist < best) { best = dist; ti = i; }
      });
      if (ti >= 0) d.results.forEach((r, i) => { r.include = i === ti; r.crosshair = i === ti; });
    }
    recomputeDraftPositions();
    d.analyzing = false; render();
    if (multi) toast(`${arr.length} trees found — the one under your crosshair is selected`);
  } catch (e) {
    d.analyzing = false;
    d.error = e.aiOff ? 'AI_OFF' : (e.message || 'Analysis failed. Check connection and try again.');
    if (!d.results) d.results = [manualDetection(d)];

function scaleImageFile(file, maxDim = 1600, q = 0.82) {
  return new Promise((res, rej) => {
    const url = URL.createObjectURL(file);
    const im = new Image();
    im.onload = () => { try { const s = Math.min(1, maxDim / Math.max(im.width, im.height)); const c = document.createElement('canvas'); c.width = Math.max(1, Math.round(im.width * s)); c.height = Math.max(1, Math.round(im.height * s)); c.getContext('2d').drawImage(im, 0, 0, c.width, c.height); URL.revokeObjectURL(url); res(c.toDataURL('image/jpeg', q)); } catch (e) { URL.revokeObjectURL(url); rej(e); } };
    im.onerror = () => { URL.revokeObjectURL(url); rej(new Error('unreadable image')); };
    im.src = url;
  });
}
async function exifMeta(file) {
  try {
    const b = new Uint8Array(await file.slice(0, 262144).arrayBuffer());
    if (b[0] !== 0xFF || b[1] !== 0xD8) return {};
    let i = 2;
    while (i + 4 < b.length) {
      if (b[i] !== 0xFF) break;
      const marker = b[i + 1], len = (b[i + 2] << 8) | b[i + 3];
      if (marker === 0xE1 && b[i + 4] === 0x45 && b[i + 5] === 0x78 && b[i + 6] === 0x69 && b[i + 7] === 0x66) return parseTiff(b, i + 10);
      i += 2 + len;
    }
  } catch (e) {}
  return {};
}
function parseTiff(b, off) {
  const out = {};
  try {
    const le = b[off] === 0x49;
    const u16 = p => le ? b[p] | (b[p + 1] << 8) : (b[p] << 8) | b[p + 1];
    const u32 = p => (le ? b[p] | (b[p + 1] << 8) | (b[p + 2] << 16) | (b[p + 3] << 24) : (b[p] << 24) | (b[p + 1] << 16) | (b[p + 2] << 8) | b[p + 3]) >>> 0;
    const rat = p => { const n = u32(p), d = u32(p + 4); return d ? n / d : 0; };
    const SZ = { 1: 1, 2: 1, 3: 2, 4: 4, 5: 8, 7: 1, 10: 8 };
    const readIFD = (ifdOff, tags) => {
      const res = {}; const n = u16(off + ifdOff);
      for (let k = 0; k < n; k++) {
        const e = off + ifdOff + 2 + k * 12;
        const tag = u16(e), type = u16(e + 2), cnt = u32(e + 4);
        let vOff = e + 8;
        if ((SZ[type] || 1) * cnt > 4) vOff = off + u32(e + 8);
        if (tags.includes(tag)) res[tag] = { cnt, vOff };
      }
      return res;
    };
    const ifd0 = readIFD(u32(off + 4), [0x8769, 0x8825]);
    if (ifd0[0x8825]) {
      const g = readIFD(u32(ifd0[0x8825].vOff), [1, 2, 3, 4]);
      if (g[2] && g[4]) {
        const dms = r => rat(r.vOff) + rat(r.vOff + 8) / 60 + rat(r.vOff + 16) / 3600;
        let lat = dms(g[2]), lng = dms(g[4]);
        if (g[1] && String.fromCharCode(b[g[1].vOff]) === 'S') lat = -lat;
        if (g[3] && String.fromCharCode(b[g[3].vOff]) === 'W') lng = -lng;
        if (isFinite(lat) && isFinite(lng) && (lat || lng)) { out.lat = lat; out.lng = lng; }
      }
    }
    if (ifd0[0x8769]) {
      const ex = readIFD(u32(ifd0[0x8769].vOff), [0x9003]);
      if (ex[0x9003]) {
        let s = ''; for (let k = 0; k < Math.min(ex[0x9003].cnt, 20); k++) s += String.fromCharCode(b[ex[0x9003].vOff + k]);
        const m = s.match(/(\d{4}):(\d{2}):(\d{2}) (\d{2}):(\d{2}):(\d{2})/);
        if (m) out.when = new Date(+m[1], +m[2] - 1, +m[3], +m[4], +m[5], +m[6]).getTime();
      }
    }
  } catch (e) {}
  return out;
}

/* ---------------- Totals (mirrors the V5 Summary tab) ---------------- */
function totals(src) {
  const T = { lines: src.length, specimens: 0, prune: 0, removal: 0, disposal: 0, stump: 0, total: 0, predicted: 0, predTotal: 0,
    byHaz: {}, byIP: { IP: { lines: 0, specimens: 0, cost: 0 }, OP: { lines: 0, specimens: 0, cost: 0 } }, byBand: {}, byZone: {}, missingPhoto: 0, unpriced: 0 };
  for (const h of HAZARDS) T.byHaz[h] = { lines: 0, specimens: 0, cost: 0 };
  for (const b of DBH_BANDS) T.byBand[b] = { lines: 0, specimens: 0 };
  for (const t of src) {
    const q = t.qty || 1, lt = lineTotal(t);
    T.specimens += q; T.prune += num(t.prune); T.removal += num(t.removal); T.disposal += num(t.disposal); T.stump += num(t.stump); T.total += lt;
    if (hasPred(t)) { T.predicted++; T.predTotal += predTotal(t) - lt; }
    if (T.byHaz[t.hazard]) { T.byHaz[t.hazard].lines++; T.byHaz[t.hazard].specimens += q; T.byHaz[t.hazard].cost += lt; }
    const ip = t.ip === 'OP' ? 'OP' : 'IP';
    T.byIP[ip].lines++; T.byIP[ip].specimens += q; T.byIP[ip].cost += lt;
    const b = DBH_BAND(t.dbhIn); if (b && T.byBand[b]) { T.byBand[b].lines++; T.byBand[b].specimens += q; }
    const z = t.zone || '(no zone)'; T.byZone[z] = T.byZone[z] || { lines: 0, specimens: 0, cost: 0 };
    T.byZone[z].lines++; T.byZone[z].specimens += q; T.byZone[z].cost += lt;
    if (t.prune == null && t.removal == null && t.disposal == null && t.stump == null) T.unpriced++;
  }
  return T;
}

    throw new Error(`Trice service error (${resp.status}). Try again in a moment.`);

Totals: ${T.lines} line items, ${T.specimens} specimens; High Hazard ${T.byHaz['High Hazard'].specimens} specimens, Moderate ${T.byHaz['Moderate'].specimens}, Cleared ${T.byHaz['Cleared'].specimens}; In-Play ${T.byIP.IP.lines} line items; priced remediation so far ${money(T.total)}.
Register (JSON): ${JSON.stringify(compact)}

Write 2-3 tight paragraphs, plain prose, no headers, no bullets, no markdown. Lead with the single most important call, naming specific asset IDs for anything urgent (in-play high-hazard first — closed holes cost revenue). State what should happen this week vs this season, note what is cleared or healthy, and close with the record-keeping value of the dated, coordinates-attached register. Confident, specific, working-arborist voice. Do not invent assets or numbers.`;

/* ---------------- Main / sub-projects ---------------- */
/* ---------------- Project hierarchy — local-first ----------------
   Filing a project under another is data, not a request. It applies on this
   phone the instant you tap, rides along with every sync (newest change wins,
   like tree records), and needs no reply from the server to take effect.
   Works offline; converges on every device within a sync cycle. */
const parentOf = name => { const e = (S.projectParents2 || {})[name]; return (e && e.p) || null; };
const subsOf = name => Object.keys(S.projectParents2 || {}).filter(c => parentOf(c) === name);
function isUnder(a, b) { let c = parentOf(a), g = 0; while (c && g++ < 8) { if (c === b) return true; c = parentOf(c); } return false; }
function projMatches(site, sel) { if (!sel) return true; if (site === sel) return true; return isUnder(site, sel); }
function projDepth(name) { let d = 0, c = parentOf(name), g = 0; while (c && g++ < 8) { d++; c = parentOf(c); } return d; }
function projScope(name) {
  const all = [...new Set([...(S.projects || []), ...Object.keys(S.projectParents2 || {})])];
  return [name, ...all.filter(x => x !== name && isUnder(x, name))];
}
/* A project deleted or archived — or filed anywhere under one — disappears
   from the map, sheets, reports, register, and pickers on every device.
   Records are never destroyed: restoring an archived project brings its
   assets straight back. */
function projHidden(p) {
  let c = p, g = 0;
  while (c && g++ < 8) {
    if (S.deletedProjects.includes(c) || S.archivedProjects.includes(c)) return true;
    c = parentOf(c);
  }
  return false;
}
const visT = t => !projHidden(siteOfT(t));
function persistParents() { try { localStorage.setItem('trice_parents2', JSON.stringify(S.projectParents2)); } catch (e) {} }
function setParentLocal(child, parent) {
  if (parent && (parent === child || isUnder(parent, child))) { toast("Can't file a project under its own sub-project"); return false; }
  S.projectParents2[child] = { p: parent || null, at: Date.now() };
  persistParents(); queueSync();
  toast(parent ? `"${child}" filed under "${parent}"` : `"${child}" moved to top level`);
  return true;
}
function mergeParents(remote) {
  if (!remote) return false;
  let ch = false;
  for (const [c, e] of Object.entries(remote)) {
    if (!e) continue;
    const cur = S.projectParents2[c];
    if (!cur || (e.at || 0) > (cur.at || 0)) { S.projectParents2[c] = { p: e.p || null, at: e.at || 0 }; ch = true; }
  }
  if (ch) persistParents();
  return ch;
}
function toggleSub(child) {
  const main = S.subsFor; if (!main) return;
  const cur = parentOf(child);
  if (setParentLocal(child, cur === main ? null : main)) render();
}
function subsSheet(main) {

    </div>

    <button onclick="toggleSub('${esc(ok2)}')" style="display:flex;align-items:center;gap:11px;width:100%;background:none;border:0;padding:13px 0;border-top:1px solid var(--hair);text-align:left;color:var(--ink)">

      <span style="flex:1;min-width:0"><span style="display:block;font-size:13.5px;font-weight:600">${esc(o)}</span>${elsewhere ? `<span style="display:block;font-size:11px;color:var(--faint)">Now under ${esc(parentOf(o))} — tapping moves it here</span>` : ''}</span>
    </button>`; }).join('') : '<div style="padding:14px 0;font-size:12.5px;color:var(--muted)">No other projects yet.</div>'}

/* Turn a sub-project into what it really is on a golf course: a location.
   Every asset moves up to the parent project and carries the sub-project's
   name in its Hole / zone field, so by-hole rollups keep working. The empty
   sub-project name is then removed. */
async function subToLocation(name, silent) {
  const parent = parentOf(name);
  if (!parent) { toast('"' + name + '" is not nested — only a project filed under another can convert to assets. Use Move first.'); return 0; }
  const scope = projScope(name);
  const affected = S.trees.filter(t => scope.includes(siteOfT(t)));
  if (!silent && !confirm('Convert "' + name + '" into assets under "' + parent + '"?\n\n' + affected.length + ' asset' + (affected.length === 1 ? '' : 's') + ' will move to "' + parent + '" with "' + name + '" as their Hole / zone. Applies to the whole team.')) return 0;
  for (const t of affected) {
    t.zone = normZone(siteOfT(t) === name ? name : siteOfT(t));
    t.site = parent;
    markDirty(t);

/* ---- Trees tab ---- */
function regFilter() {
  let list = S.trees.slice().reverse();
  const q = S.regQ.trim().toLowerCase();
  if (q) list = list.filter(t => { const a = t.ai || {}; return `${t.id} ${a.species||''} ${a.latin||''} ${t.zone||''} ${t.locDetails||''} ${t.cause||''} ${(a.action||'')}`.toLowerCase().includes(q); });
  if (S.regHaz !== 'all') list = S.regHaz === 'pending' ? list.filter(t => t.pending) : list.filter(t => t.hazard === S.regHaz);
  if (ADMIN() && S.regUser) list = list.filter(t => (t.surveyor || 'Unassigned') === S.regUser);
  return list;
}

async function bulkMove() {
  const sel = document.getElementById('admMove'); const p = sel && sel.value;
  if (!p) { toast('Pick a destination project'); return; }
  const list = regFilter();
  if (!list.length) return;
  for (const t of list) { t.site = p; markDirty(t); try { await DB.putTree(stripRuntime(t)); } catch (e) {} }
  toast(`${list.length} record${list.length > 1 ? 's' : ''} moved to ${p} — synced to the team`);
  render();
}
async function bulkDelete() {
  const list = regFilter();
  if (!list.length) return;
  if (!confirm(`Delete ${list.length} record${list.length > 1 ? 's' : ''} from the register?`)) return;
  if (!confirm('Really delete? This removes them for every device (a tombstone syncs). Export a backup first if unsure.')) return;
  const tb = tombs();
  for (const t of list) { try { await DB.delTree(t.id); } catch (e) {} tb.push(t.id); }
  localStorage.setItem('trice_tombs', JSON.stringify(tb));
  const ids = new Set(list.map(t => t.id));
  S.trees = S.trees.filter(t => !ids.has(t.id));
  queueSync();
  S.detailId = null; S.editId = null;
  toast(`${ids.size} deleted — register updated everywhere`);
  render();
}

/* ---- Adjust pin ---- */
let adjMapObj = null, adjMarker = null;
function openAdjust(id) {
  const t = S.trees.find(x => x.id === id);
  if (t && typeof t.lat !== 'number') {
    const ref = S.trees.find(x => typeof x.lat === 'number' && siteOfT(x) === siteOfT(t)) || S.trees.find(x => typeof x.lat === 'number');
    if (!ref) { toast('No map anchor yet — log one GPS capture first, then place this pin'); return; }
    t._anchor = [ref.lat, ref.lng];
  }
  S.adjustId = id; render(); requestAnimationFrame(mountAdjustMap);
}
function mountAdjustMap() {
  const t = S.trees.find(x => x.id === S.adjustId); const el = document.getElementById('adjMap');
  if (!t || !el || typeof L === 'undefined') return;
  if (adjMapObj) { adjMapObj.remove(); adjMapObj = null; }
  const hasPos = typeof t.lat === 'number';
  const at = hasPos ? [t.lat, t.lng] : (t._anchor || null);
  if (!at) return;
  adjMapObj = L.map(el, { zoomControl: true, attributionControl: true }).setView(at, hasPos ? 19 : 17);
  baseLayer('sat').addTo(adjMapObj);
  adjMarker = L.marker(at, { draggable: true, icon: pinIcon(t) }).addTo(adjMapObj);
}
async function saveAdjust() {
  const t = S.trees.find(x => x.id === S.adjustId);
  if (t && adjMarker) {
    const p = adjMarker.getLatLng();
    t.lat = p.lat; t.lng = p.lng; t.posMethod = 'adjusted'; delete t._anchor; markDirty(t);
    try { await DB.putTree(stripRuntime(t)); } catch (e) {}
    toast(`${t.id} position verified on imagery`);
  }
  closeAdjust();
}
function closeAdjust() { if (adjMapObj) { adjMapObj.remove(); adjMapObj = null; adjMarker = null; } S.adjustId = null; render(); }
function adjustSheet(t) {
  return `
  <div class="sheet-scrim" onclick="closeAdjust()"></div>
  <div class="sheet">
    <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:10px"><span class="slab" style="color:var(--info);font-weight:700">Fine-tune ${t.id}</span><button onclick="closeAdjust()" style="border:0;background:none;font-size:20px;line-height:1;color:var(--muted)">×</button></div>
    <div style="font-size:12.5px;color:var(--muted);margin-bottom:10px">Drag the pin onto the tree’s canopy — coordinates are what defend the record.</div>
    <div id="adjMap"></div>
    <button class="btn dark" style="margin-top:12px" onclick="saveAdjust()">Save position</button>
  </div>`;
}

/* ---- Map: Red / Yellow / Green — the map is the task list ---- */
let leafletMap = null;
function baseLayer(kind) {
  if (kind === 'sat') return L.tileLayer('https://server.arcgisonline.com/ArcGIS/rest/services/World_Imagery/MapServer/tile/{z}/{y}/{x}', { maxZoom: 19, attribution: 'Imagery © Esri' });
  return L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', { maxZoom: 19, attribution: '© OpenStreetMap' });
}
function pinIcon(t) {
  const pending = t.pending && !t.ai;
  const haz = t.hazard || 'Moderate';
  const c = pending ? '#8a929b' : HAZ_INK(haz);
  const hi = haz === 'High Hazard' && !pending;
  const size = hi ? 34 : 26;
  const glyph = pending ? '?' : (hi ? '▲' : (haz === 'Cleared' ? '✓' : ''));
  const qty = (t.qty || 1) > 1 ? `<span class="qty">${t.qty}</span>` : '';
  return L.divIcon({ className: '', html: `<div class="pin2" style="width:${size}px;height:${size}px;background:${c};font-size:${hi ? 12 : 12.5}px">${glyph}${qty}</div>`, iconSize: [size, size], iconAnchor: [size / 2, size / 2] });
}
function mapUsers(src) {
  const m = {};
  for (const t of (src || S.trees).filter(x => typeof x.lat === 'number')) {
    const k = t.surveyor || 'Unassigned';
    if (!m[k]) m[k] = { n: 0 };
    m[k].n++;
  }
  return m;
}
function setMapUser(name) { S.mapUser = (S.mapUser === name || name === null) ? null : name; render(); }
function netCard() {
  const now = Date.now();
  const act = (S.usersMeta || []).filter(u => u && u.name && (now - (u.lastSeen || 0)) < 75000).sort((a, b) => a.name.localeCompare(b.name));
  return `
  <div class="slab" style="margin:18px 0 8px">On the network now</div>
  <div class="card" style="padding:${act.length ? '4px 15px' : '15px'}">
    ${act.length ? act.map((u, i) => `<div style="display:flex;align-items:center;gap:11px;padding:11px 0;${i ? 'border-top:1px solid var(--hair)' : ''}"><span style="width:10px;height:10px;border-radius:50%;background:var(--good);animation:adpulse 1.6s infinite;flex:none"></span><span style="flex:1;min-width:0;font-size:13.5px;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis">${esc(u.name)}${u.name === S.surveyor ? ' <span style="font-weight:500;color:var(--faint)">· you</span>' : ''}</span><span class="chip good">Live</span></div>`).join('') : `<div style="font-size:12.5px;color:var(--muted);line-height:1.55">No one is on right now. Teammates appear here with a live dot while their device is syncing — names only, never their location.</div>`}
  </div>`;
}
function mapView() {
  const projs = topProjects();
  const scoped = S.trees.filter(t => visT(t) && projMatches(siteOfT(t), S.mapProject));
  const all = scoped.filter(t => typeof t.lat === 'number');
  const users = mapUsers(scoped);
  const names = Object.keys(users).sort((a, b) => a === S.surveyor ? -1 : (b === S.surveyor ? 1 : a.localeCompare(b)));
  const withGps = S.mapUser ? all.filter(t => (t.surveyor || 'Unassigned') === S.mapUser) : all;
  const T = totals(scoped);
  return `

function setBasemap(k) { S.basemap = k; localStorage.setItem('trice_basemap', k); render(); }
function setMapProject(p) { S.mapProject = p; S.mapUser = null; render(); }
/* The map opens as a project atlas: one badge per project (initials + worst
   open hazard as the ring color). Specimen pins appear once a project is
   chosen — by tapping its badge or the dropdown. */
function rootProjOf(site) { let c = site || '', g = 0; while (parentOf(c) && g++ < 8) c = parentOf(c); return c || 'Unassigned'; }
function projInitials(name) {
  const skip = new Set(['of', 'the', 'at', 'a', 'an', 'de', 'la', 'and', '&']);
  const words = String(name || '').split(/[^A-Za-z0-9]+/).filter(w => w && !skip.has(w.toLowerCase()));
  const out = words.map(w => w[0].toUpperCase()).join('');
  return (out || '?').slice(0, 3);
}
function projBadgeIcon(name, info) {
  const ring = info.worst === 2 ? 'var(--bad)' : (info.worst === 1 ? 'var(--warn)' : 'var(--good)');
  return L.divIcon({ className: '', html: `<div class="projpin" style="box-shadow:0 0 0 3px ${ring},0 4px 12px rgba(8,12,18,.45)"><span>${esc(projInitials(name))}</span><span class="projn">${info.n}</span></div>`, iconSize: [40, 40], iconAnchor: [20, 20] });
}
function mountMap() {
  const el = document.getElementById('map'); if (!el || typeof L === 'undefined') return;
  if (leafletMap) { leafletMap.remove(); leafletMap = null; }
  let withGps = S.trees.filter(t => visT(t) && typeof t.lat === 'number');
  if (S.mapProject) withGps = withGps.filter(t => projMatches(siteOfT(t), S.mapProject));
  if (S.mapUser) withGps = withGps.filter(t => (t.surveyor || 'Unassigned') === S.mapUser);
  leafletMap = L.map(el, { zoomControl: true, attributionControl: true });
  baseLayer(S.basemap).addTo(leafletMap);
  if (!S.mapProject && withGps.length) {
    const groups = {};
    for (const t of withGps) {
      const r = rootProjOf(siteOfT(t));
      const g = groups[r] || (groups[r] = { lat: 0, lng: 0, n: 0, worst: 0 });
      g.lat += t.lat; g.lng += t.lng; g.n++;
      const w = t.hazard === 'High Hazard' ? 2 : (t.hazard === 'Moderate' ? 1 : 0);
      if (w > g.worst) g.worst = w;
    }
    const bounds = [];
    const badges = [];
    for (const [name, g] of Object.entries(groups)) {
      const at = [g.lat / g.n, g.lng / g.n];
      const m = L.marker(at, { icon: projBadgeIcon(name, g), zIndexOffset: 400 }).addTo(leafletMap).on('click', () => setMapProject(name)).bindTooltip(name, { direction: 'top', offset: [0, -24] });
      badges.push({ m, at });
      bounds.push(at);
    }
    /* Neighboring projects share the same few pixels at wide zoom — fan their
       badges out in a ring so every one stays visible and tappable. Positions
       are recomputed from the true centers on every zoom, so zooming in lets
       badges settle back onto their real locations. */
    const spreadBadges = () => {
      if (!leafletMap) return;
      const pts = badges.map(b => ({ b, p: leafletMap.latLngToContainerPoint(L.latLng(b.at[0], b.at[1])), grp: -1 }));
      const R = 46;
      let gi = 0;
      for (const a of pts) {
        if (a.grp >= 0) continue;
        a.grp = gi;
        for (const c of pts) { if (c.grp < 0 && Math.hypot(c.p.x - a.p.x, c.p.y - a.p.y) < R) c.grp = gi; }
        gi++;
      }
      for (let g2 = 0; g2 < gi; g2++) {
        const grp = pts.filter(x => x.grp === g2);
        if (grp.length === 1) { grp[0].b.m.setLatLng(grp[0].b.at); continue; }
        const cx = grp.reduce((s, x) => s + x.p.x, 0) / grp.length;
        const cy = grp.reduce((s, x) => s + x.p.y, 0) / grp.length;
        const rad = 26 + grp.length * 5;
        grp.sort((x, y) => x.p.x - y.p.x || x.p.y - y.p.y);
        grp.forEach((x, i2) => {
          const ang = (2 * Math.PI * i2) / grp.length - Math.PI / 2;
          const np = L.point(cx + rad * Math.cos(ang), cy + rad * Math.sin(ang));
          x.b.m.setLatLng(leafletMap.containerPointToLatLng(np));
        });
      }
    };
    leafletMap.fitBounds(bounds, { padding: [56, 56], maxZoom: 15 });
    leafletMap.whenReady(() => setTimeout(spreadBadges, 60));
    leafletMap.on('zoomend', spreadBadges);
  } else if (withGps.length) {
    const bounds = [];
    for (const t of withGps) {
      L.marker([t.lat, t.lng], { icon: pinIcon(t) }).addTo(leafletMap).on('click', () => openZoom(t.id, true));
      bounds.push([t.lat, t.lng]);
    }
    leafletMap.fitBounds(bounds, { padding: [42, 42], maxZoom: 19 });
  } else if (S.gpsWatch.ok) {
    leafletMap.setView([S.gpsWatch.lat, S.gpsWatch.lng], 18);
  } else {
    leafletMap.setView([26.1420, -81.7946], 16);
  }
  if (S.gpsWatch.ok) L.circleMarker([S.gpsWatch.lat, S.gpsWatch.lng], { radius: 6, color: '#fff', weight: 2, fillColor: '#2f5573', fillOpacity: 1 }).addTo(leafletMap).bindPopup('You are here');
}

function otThresh() { return (S.budgets['~ot'] && S.budgets['~ot'].hours) || 40; }
function setOT(v) { const h = Math.max(0, parseFloat(v) || 40); S.budgets['~ot'] = { hours: h, at: Date.now() }; S.budgetDirty['~ot'] = S.budgets['~ot']; try { localStorage.setItem('trice_budgets', JSON.stringify(S.budgets)); } catch (e) {} queueSync(); render(); }

function weekStart(off) {

function teamCost() {
  const roots = [...new Set(S.trees.filter(visT).map(t => rootProjOf(siteOfT(t))).concat(Object.values(S.hoursMap).filter(e => e && !e.del && e.project).map(e => rootProjOf(e.project))))].filter(p => p && !projHidden(p)).sort();
  if (!roots.length) return '<div class="card" style="padding:20px;font-size:13px;color:var(--muted)">Job costing appears once hours or captures are logged against projects.</div>';
  const rows = roots.map(p => {
    const hrs = Object.values(S.hoursMap).filter(e => e && !e.del && (e.kind || 'work') === 'work' && rootProjOf(e.project) === p);
    const actual = hrs.reduce((s, e) => s + elapsedHrs(e), 0);
    const cost = hrs.reduce((s, e) => s + elapsedHrs(e) * ((S.emp[e.user] || {}).rate || 0), 0);
    const assets = S.trees.filter(t => visT(t) && rootProjOf(siteOfT(t)) === p).length;
    const budget = (S.budgets[p] && S.budgets[p].hours) || 0;
    const crew = new Set(hrs.map(e => e.user)).size;
    return { p, actual, cost, assets, budget, crew };
  });
  return `
  <div class="slab" style="margin:0 0 8px">Job costing — labor vs budget, by project</div>
  <div class="card" style="padding:13px 15px;overflow-x:auto">
    <table style="width:100%;border-collapse:collapse;font-size:12.5px;min-width:720px">
      <tr style="color:var(--faint);font-size:10.5px;letter-spacing:.05em;text-transform:uppercase;text-align:right"><th style="text-align:left;padding:5px 8px 8px 0">Project</th><th style="padding:5px 8px 8px">Budget h</th><th style="padding:5px 8px 8px">Actual h</th><th style="padding:5px 8px 8px">Variance</th><th style="padding:5px 8px 8px">Labor $</th><th style="padding:5px 8px 8px">Crew</th><th style="padding:5px 8px 8px">Assets</th><th style="padding:5px 0 8px 8px">Assets / h</th></tr>
      ${rows.map(r => { const over = r.budget && r.actual > r.budget; const pct = r.budget ? Math.min(100, r.actual / r.budget * 100) : 0; const k = r.p.replace(/'/g, "\\\\'"); return `
      <tr style="border-top:1px solid var(--hair);text-align:right">
        <td style="text-align:left;padding:8px 8px 8px 0;font-weight:700;white-space:nowrap;max-width:220px;overflow:hidden;text-overflow:ellipsis">${esc(r.p)}${r.budget ? `<div style="height:4px;background:var(--hair);border-radius:99px;margin-top:5px;max-width:180px"><div style="height:4px;border-radius:99px;width:${pct}%;background:${over ? 'var(--bad)' : 'var(--good)'}"></div></div>` : ''}</td>
        <td style="padding:8px"><input type="number" min="0" step="1" value="${r.budget || ''}" placeholder="—" onchange="setBudget('${esc(k)}', this.value);render()" style="${TEAM_INP};width:70px;text-align:right"></td>
        <td style="padding:8px;font-weight:700">${r.actual ? r.actual.toFixed(1) : '—'}</td>
        <td style="padding:8px;font-weight:700;color:${r.budget ? (over ? 'var(--bad)' : 'var(--good)') : 'var(--faint)'}">${r.budget ? ((r.budget - r.actual >= 0 ? '+' : '') + (r.budget - r.actual).toFixed(1) + ' h') : '—'}</td>
        <td style="padding:8px">${r.cost ? '$' + r.cost.toFixed(0) : '—'}</td>
        <td style="padding:8px">${r.crew || '—'}</td>
        <td style="padding:8px">${r.assets || '—'}</td>
        <td style="padding:8px 0 8px 8px;font-weight:700">${r.actual && r.assets ? (r.assets / r.actual).toFixed(1) : '—'}</td>
      </tr>`; }).join('')}
    </table>
    <div style="margin-top:10px;font-size:11px;color:var(--faint)">Assets / h joins the crew's captured field records with logged labor — productivity the timesheet apps can't see. Set a budget to get the variance bar.</div>
  </div>`;
}

/* ---- Subcontractors ----

   crew doesn't: trade, contact, COI insurance expiry with renewal warnings, and the
   project they're working. Feeds the "Sub work scope" deliverable on Report. */
function subUpd(name, field, val) {
  const s = S.subs[name] || { name, active: true };
  if (field === 'active') val = !!val;
  s[field] = val; s.at = Date.now();
  S.subs[name] = s; S.subsDirty[name] = s;
  try { localStorage.setItem('trice_subs', JSON.stringify(S.subs)); } catch (er) {}
  queueSync();
}
function subAdd() {
  const el = document.getElementById('subNew'); const name = (el && el.value || '').trim();
  if (!name) return;
  if (S.subs[name] && S.subs[name].del !== true) { toast('That subcontractor is already on the list'); return; }
  S.subs[name] = { name, contact: '', trade: '', phone: '', email: '', rateNote: '', coiExp: '', project: '', notes: '', active: true, at: Date.now() };
  S.subsDirty[name] = S.subs[name];
  try { localStorage.setItem('trice_subs', JSON.stringify(S.subs)); } catch (er) {}
  queueSync(); render();
}
function subDel(name) {
  if (!confirm('Remove ' + name + ' from the subcontractor list? This syncs to every device.')) return;
  subUpd(name, 'del', true);
  toast(name + ' removed');
  render();
}

  </div>

    <table style="width:100%;border-collapse:collapse;font-size:12.5px;min-width:1060px">

      ${subs.map(s => { const k = s.name.replace(/'/g, "\\'"); const off = s.active === false; const x = s.coiExp ? new Date(s.coiExp + 'T12:00').getTime() : 0; const expired = x && x < Date.now(); const expSoon = x && !expired && x < soon; const noCoi = !x && !off; return `

        <td style="padding:8px 8px 8px 0"><select onchange="subUpd('${esc(k)}','project',this.value)" style="${TEAM_INP};width:150px"><option value="">\u2014</option>${projs.map(p => `<option ${s.project === p ? 'selected' : ''}>${esc(p)}</option>`).join('')}</select></td>

/* ---------------- AI pricing predictions ----------------

   1. Amy Cushman's rate card (crew $150/hr, debris $30/cu yd, stump $150/hr, $5,000/specimen sublimit)
   2. Amy's ten priced Burnham rows (implied hours: prune ≈ DBH/4 h, removal ≈ DBH×0.95 h; prune debris 2–3 yd, removal debris ≈ DBH×0.75 yd)

  if (haz === 'Cleared') return null;

  const p = { prune: null, removal: null, disposal: null, stump: null };
  if (haz === 'High Hazard') {

    p.disposal = r10(Math.max(4, Math.round(dbh * 0.75)) * RATE.debrisYd) * q;
    p.stump = r10(Math.max(1, Math.round(dbh / 8)) * RATE.stumpHr) * q;

/* The Sheets hero — a live, scaled preview of the grid exhibit built from the rows

   rendered small; what you see is exactly what prints. */
function gridHero(TS, label) {
  const docW = 1020;
  const availW = Math.min(window.innerWidth, 560) - 66;

  const previewH = IS_DESKTOP() ? 340 : 300;
  return `

      <div style="width:${docW}px;transform:scale(${sc});transform-origin:0 0;padding:22px;pointer-events:none">${gridExhibitHTML(TS, label)}</div>
      <div style="position:absolute;inset:auto 0 0 0;height:70px;background:linear-gradient(transparent,#f3f1ec)"></div>
      <span style="position:absolute;right:10px;bottom:10px;background:rgba(23,24,26,.78);color:#fff;font-size:10.5px;font-weight:700;border-radius:999px;padding:6px 12px">Tap to open full preview</span>

    </div>
  </div>`;
}

function assetDatabaseHTML(TS, label) {
  const T = totals(TS);

  const INK = '#1d1d1f', GRAY = '#6e6e73', HAIR = '#e8e8ed', PAPER = '#fbfbfd';
  const FONT = "-apple-system,BlinkMacSystemFont,'SF Pro Display','Helvetica Neue',Helvetica,Arial,sans-serif";

  const photod = TS.filter(t => t.photo).length;
  const spec = (k, v) => v ? `<div style="display:flex;justify-content:space-between;gap:18px;padding:9px 0;border-top:1px solid ${HAIR}"><span style="flex:none;font-size:11px;color:${GRAY}">${k}</span><span style="flex:1;text-align:right;font-size:11.5px;color:${INK};line-height:1.5">${v}</span></div>` : '';
  const stat = (n, l) => `<div style="flex:1;min-width:110px;text-align:center;padding:4px 10px"><div style="font-size:34px;font-weight:600;letter-spacing:-.02em;color:${INK}">${n}</div><div style="font-size:11px;color:${GRAY};margin-top:2px">${l}</div></div>`;
  const card = t => {
    const a = t.ai || {};
    const lt = lineTotal(t);
    const remed = lt > 0 ? money(lt) + (a.action ? ' \u00b7 ' + esc(a.action) : '')
      : (hasPred(t) ? `<span style="color:#b8842a">\u2248${money(predTotal(t))} \u00b7 AI predicted, awaiting review</span>` : `<span style="color:#b8842a">To be determined</span>${a.action ? ' \u00b7 ' + esc(a.action) : ''}`);
    return `
    <div style="flex:1;min-width:440px;max-width:calc(50% - 14px);page-break-inside:avoid">
      ${t.photo ? `<img src="${t.photo}" style="display:block;width:100%;height:380px;object-fit:cover;border-radius:20px" alt="">`
        : `<div style="height:380px;border-radius:20px;background:#f2f2f7;display:flex;align-items:center;justify-content:center;color:#aeaeb2;font-size:12px">Photo syncing from the field</div>`}
      <div style="padding:18px 6px 6px">
        <div style="display:flex;align-items:baseline;justify-content:space-between;gap:12px">
          <div style="font-size:21px;font-weight:600;letter-spacing:-.015em;color:${INK}">${esc(a.species || 'Pending analysis')}</div>
          <div style="flex:none;display:flex;align-items:center;gap:6px;font-size:11px;color:${GRAY}"><span style="width:8px;height:8px;border-radius:50%;background:${hazDot(t.hazard || 'Moderate')}"></span>${esc(t.hazard || 'Moderate')}</div>
        </div>
        ${a.latin ? `<div style="font-size:12.5px;color:${GRAY};font-style:italic;margin-top:1px">${esc(a.latin)}</div>` : ''}
        <div style="margin-top:14px">
          ${spec('Asset', `<span style="font-family:ui-monospace,'SF Mono',Menlo,monospace">${esc(t.id)}</span>`)}
          ${spec('Size', `${t.qty || 1} specimen${(t.qty || 1) > 1 ? 's' : ''}${t.dbhIn ? ' \u00b7 ' + t.dbhIn + '\u2033 DBH' : ''}${t.heightFt ? ' \u00b7 ~' + t.heightFt + ' ft' : ''}`)}
          ${spec('Location', `${esc(t.zone || '\u2014')}${t.locDetails ? ' \u00b7 ' + esc(t.locDetails) : ''} \u00b7 ${t.ip === 'OP' ? 'Out of play' : 'In play'}`)}
          ${spec('Condition', esc(a.description || ''))}
          ${spec('Failure', esc((t.failures || []).join(' \u00b7 ')))}
          ${spec('Cause', esc(t.cause || ''))}
          ${t.notes ? spec('Notes', esc(t.notes)) : ''}
          ${spec('Remediation', remed)}
          ${spec('Captured', `${new Date(t.when).toLocaleDateString('en-US', { month: 'short', day: 'numeric', year: 'numeric' })}${t.surveyor ? ' \u00b7 ' + esc(t.surveyor) : ''}${typeof t.lat === 'number' ? ' \u00b7 GPS on record' : ''}`)}
        </div>
      </div>
    </div>`;
  };
  return `
  <div style="font-family:${FONT};background:${PAPER};color:${INK};-webkit-print-color-adjust:exact;print-color-adjust:exact;padding:8px 2px">
    <div style="text-align:center;padding:34px 0 10px">
      <div style="font-size:11px;letter-spacing:.32em;font-weight:700;color:${GRAY}">TRICE</div>
      <div style="font-size:44px;font-weight:600;letter-spacing:-.025em;margin-top:14px;line-height:1.08">${esc(site)} Asset Database</div>
      <div style="font-size:14px;color:${GRAY};margin-top:12px">Every asset. Photographed, measured, and on the record. ${new Date().toLocaleDateString('en-US', { month: 'long', day: 'numeric', year: 'numeric' })}.</div>

      ${stat(T.lines, 'assets')}${stat(T.specimens, 'specimens')}${stat(T.byHaz['High Hazard'].lines, 'high hazard')}${stat(photod, 'photographed')}${stat(T.total ? money(T.total) : '\u2014', 'remediation')}
    </div>
    <div style="display:flex;flex-wrap:wrap;gap:28px;margin-top:38px">${TS.map(card).join('')}</div>
    <div style="text-align:center;margin-top:44px;padding:18px 30px 8px;border-top:1px solid ${HAIR};font-size:10px;color:#aeaeb2;line-height:1.7;max-width:760px;margin-left:auto;margin-right:auto">
      Every photograph is bound to its record \u2014 species, dimensions, hazard, GPS and time travel with the image. Assessment by visual inspection from the ground, to ANSI A300 and Z133. Generated by Trice.
    </div>

}
function openAssetDatabase() {

    <div class="body"><div class="paper" id="reviewPaper" contenteditable="false" style="max-width:1120px;background:#fbfbfd">${document.getElementById('printReport').innerHTML}</div></div>`;

/* ---- The Grid Exhibit ----
   The register rendered as a carrier-ready document in the Trice design language:
   branded header, navy stat band, glance tiles, CSS charts, the full register table
   with totals, and a data-quality footer. Everything is computed live from the rows
   in the current Grid scope (project + search + hazard filters). Predictions never
   appear — unpriced and predicted lines print as TBD, the way an honest exhibit reads. */
const GX_NAVY = '#1b2733', GX_CREAM = '#f3f1ec', GX_ACCENT = '#c8452c';
const GX_HAZ = h => h === 'High Hazard' ? ['#b34b48', '\u25b2', 'HIGH HAZARD'] : (h === 'Cleared' ? ['#2f7d55', '\u25a0', 'CLEARED'] : ['#b8842a', '\u25cf', 'MODERATE']);
const gxMoney = (v, pv) => v > 0 ? money(v) : (pv > 0 ? `<span style="color:#b8842a;font-weight:700;font-family:ui-monospace,Menlo,monospace">\u2248${money(pv)}</span>` : '<span style="color:#b8842a;font-weight:700;font-size:9px;letter-spacing:.04em">TBD</span>');
function gridExhibitHTML(TS, label) {
  const j = S.job || {};
  const T = totals(TS);
  const today = new Date().toLocaleDateString('en-US', { day: 'numeric', month: 'long', year: 'numeric' });
  const counts = (arr) => { const m = {}; for (const k of arr) if (k) m[k] = (m[k] || 0) + 1; return Object.entries(m).sort((a, b) => b[1] - a[1]); };
  const causeTop = counts(TS.map(t => t.cause))[0];
  const specByName = {}; for (const t of TS) { const s = (t.ai && t.ai.species) || 'Pending analysis'; specByName[s] = (specByName[s] || 0) + (t.qty || 1); }
  const species = Object.entries(specByName).sort((a, b) => b[1] - a[1]);
  const zones = {}; for (const t of TS) { const z = t.zone || 'No zone'; const o = zones[z] = zones[z] || { spec: 0, cost: 0, pred: 0 }; o.spec += (t.qty || 1); o.cost += lineTotal(t) || 0; if (!lineTotal(t) && hasPred(t)) o.pred += predTotal(t) || 0; }
  const zoneKeys = Object.keys(zones).sort(zoneSort);
  const fails = {}; for (const t of TS) for (const f of (t.failures || [])) fails[f] = (fails[f] || 0) + 1;
  const failTop = Object.entries(fails).sort((a, b) => b[1] - a[1]);
  const dbhTotal = TS.reduce((s, t) => s + (t.dbhIn || 0) * (t.qty || 1), 0);
  const dbhKnown = TS.filter(t => t.dbhIn).length;
  const gpsN = TS.filter(t => typeof t.lat === 'number').length;
  const priced = TS.filter(t => lineTotal(t) > 0).length;
  const anyPriced = T.total > 0;
  const predSum = TS.reduce((s, t) => s + ((!lineTotal(t) && hasPred(t)) ? (predTotal(t) || 0) : 0), 0);
  const assessors = [...new Set(TS.map(t => t.surveyor).filter(Boolean))];
  const idSlug = (label === 'All projects' ? 'TRICE' : label.replace(/[^A-Za-z0-9]+/g, '').slice(0, 10).toUpperCase() || 'TRICE') + '-' + new Date().getFullYear();
  const K = 'font-size:8.5px;letter-spacing:.12em;text-transform:uppercase;color:#98948a;font-weight:700';
  const tile = (k, v, sub) => `<div style="flex:1;min-width:118px;background:#fff;border:1px solid #e7e4dc;border-radius:13px;padding:13px 14px;page-break-inside:avoid"><div style="${K}">${k}</div><div style="font-size:23px;font-weight:800;letter-spacing:-.02em;margin-top:3px;color:#17181a">${v}</div>${sub ? `<div style="font-size:9.5px;color:#86837b;margin-top:3px;line-height:1.4">${sub}</div>` : ''}</div>`;
  const bar = (lab, n, max, right, col) => `<div style="display:flex;align-items:center;gap:8px;margin-top:5px"><div style="width:104px;font-size:9.5px;color:#5c584f;text-align:right;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;flex:none;font-weight:600">${esc(lab)}</div><div style="flex:1;height:11px;background:${GX_CREAM};border-radius:4px;overflow:hidden"><div style="height:100%;width:${Math.max(2, Math.round(n / max * 100))}%;background:${col || GX_NAVY};border-radius:4px"></div></div><div style="width:58px;font-size:9.5px;font-weight:800;flex:none;font-family:ui-monospace,Menlo,monospace">${right}</div></div>`;
  const panel = (title, sub, inner) => `<div style="flex:1;min-width:300px;background:#fff;border:1px solid #e7e4dc;border-radius:13px;padding:15px 16px;page-break-inside:avoid"><div style="font-size:11.5px;font-weight:800;color:#17181a">${title}</div>${sub ? `<div style="font-size:9.5px;color:#86837b;margin-top:2px;line-height:1.45">${sub}</div>` : ''}<div style="margin-top:9px">${inner}</div></div>`;
  const zMax = Math.max(1, ...zoneKeys.map(z => zones[z].spec));
  const zCostMax = Math.max(1, ...zoneKeys.map(z => zones[z].cost));
  const spMax = Math.max(1, ...(species.slice(0, 7).map(s => s[1])));
  const flMax = Math.max(1, ...(failTop.map(f => f[1])));
  const bMax = Math.max(1, ...DBH_BANDS.map(b => T.byBand[b].specimens));
  const th = t => `<th style="background:${GX_NAVY};color:#fff;font-size:7.5px;letter-spacing:.09em;text-transform:uppercase;text-align:left;padding:8px 7px;white-space:nowrap;font-weight:700">${t}</th>`;
  const td = (v, extra) => `<td style="padding:7px;border-bottom:1px solid #efece5;font-size:9.5px;color:#403d37;vertical-align:top;${extra || ''}">${v}</td>`;
  const rows = TS.map((t, i) => {
    const a = t.ai || {};
    const hz = GX_HAZ(t.hazard || 'Moderate');
    const lt = lineTotal(t);

/* Review-overlay editing policy: computed content (glance tiles, stat bands, charts,
   totals) is locked — it is derived from the register and must never be hand-edited.
   Only line-item rows inside tables are editable; header and totals rows stay locked. */
function lockPaperEditing() {
  const p = document.getElementById('reviewPaper'); if (!p) return;
  p.contentEditable = 'false';
  p.querySelectorAll('table').forEach(tb => {
    tb.contentEditable = 'true';
    tb.querySelectorAll('tr').forEach(tr => {
      if (tr.dataset.locked === '1' || tr.querySelector('th')) tr.contentEditable = 'false';
    });
  });
}

/* Mobile grid — the same rows as the spreadsheet, readable one-handed.
   Grouped by capture date like a stack of field sheets; tap a row to edit it.
   The full table lives behind the "Full grid" button. */
function gridCards(list) {
  const groups = {};
  for (const t of list) {
    const k = t.when ? new Date(t.when).toLocaleDateString('en-US', { month: 'short', day: 'numeric', year: 'numeric' }) : 'Undated';
    (groups[k] = groups[k] || []).push(t);
  }
  const keys = Object.keys(groups).sort((a, b) => (groups[b][0].when || 0) - (groups[a][0].when || 0));
  return keys.map(day => {
    const g = groups[day];
    const tot = g.reduce((s, t) => s + (lineTotal(t) || 0), 0);
    return `
    <div class="slab" style="margin:16px 2px 8px;display:flex;justify-content:space-between;align-items:baseline"><span>${esc(day)}</span><span style="letter-spacing:0;text-transform:none;font-weight:600;color:var(--muted)">${g.length} item${g.length > 1 ? 's' : ''}${tot ? ' · ' + money(tot) : ''}</span></div>
    <div class="card" style="padding:3px 15px">${g.map(gridCardRow).join('')}</div>`;
  }).join('') + `<div style="margin:14px 2px 0;font-size:11px;color:var(--faint);text-align:center">Tap a row to open and edit · ⛶ Full grid shows every column</div>`;
}
function gridCardRow(t) {

  const merc = (lat, lng, z) => {

    const r = lat * Math.PI / 180;
    const y = (1 - Math.log(Math.tan(r) + 1 / Math.cos(r)) / Math.PI) / 2 * s;

    z--;

  const xs = ps.map(p => p[0]), ys = ps.map(p => p[1]);

    <div style="margin-top:10px;position:relative;width:${W}px;max-width:100%;height:${H}px;border:1px solid #ddd;border-radius:10px;overflow:hidden;background:#eef0ea">${tiles}${pins}</div>
    <div style="display:flex;gap:14px;margin-top:6px;font-size:9px;color:#777;align-items:center;flex-wrap:wrap">
      <span><span style="display:inline-block;width:8px;height:8px;border-radius:50%;background:#b34b48;margin-right:4px"></span>High Hazard</span>
      <span><span style="display:inline-block;width:8px;height:8px;border-radius:50%;background:#b8842a;margin-right:4px"></span>Moderate</span>
      <span><span style="display:inline-block;width:8px;height:8px;border-radius:50%;background:#2f7d55;margin-right:4px"></span>Cleared</span>
      <span style="margin-left:auto">${pts.length} of ${TS.length} records pinned at captured GPS \u00b7 basemap \u00a9 OpenStreetMap \u00b7 print with an internet connection for the basemap</span>

/* ---------------- On-photo ruler ----------------
   Distance to trunk (from the AI) + lens field of view turn a pixel span
   into feet. tan-mapped, honest about being an estimate. */
function rulerFeet(distM, y1, y2, portrait) {
  if (!distM) return null;
  const fov = (portrait ? 64 : 48) * Math.PI / 180;   // FOV along the image's vertical axis
  const ang = y => (0.5 - y) * fov;
  const m = distM * (Math.tan(ang(Math.min(y1, y2))) - Math.tan(ang(Math.max(y1, y2))));
  return Math.abs(m) * 3.28084;
}
function openRuler(id) {
  const t = S.trees.find(x => x.id === id); if (!t) return;
  const d = t.dist || (t.ai && t.ai.distance_m);
  if (!d) { toast('No camera distance on this record — the ruler needs it'); return; }
  S.ruler = { id, y1: 0.22, y2: 0.86, portrait: true, drag: 0 };
  const im = new Image(); im.onload = () => { if (S.ruler) { S.ruler.portrait = im.height >= im.width; rulerReadout(); } }; im.src = t.photo;
  render();
}
function rulerReadout() {
  const r = S.ruler; if (!r) return;
  const t = S.trees.find(x => x.id === r.id); if (!t) return;
  const ft = rulerFeet(t.dist || (t.ai && t.ai.distance_m), r.y1, r.y2, r.portrait);
  const el = document.getElementById('rulerFt'); if (el) el.textContent = ft ? '≈ ' + Math.round(ft) + ' ft' : '—';
  const l1 = document.getElementById('rl1'), l2 = document.getElementById('rl2');
  if (l1) l1.style.top = (r.y1 * 100) + '%'; if (l2) l2.style.top = (r.y2 * 100) + '%';
}
function rulerPointer(e, phase) {
  const r = S.ruler; if (!r) return;
  const box = document.getElementById('rulerBox'); if (!box) return;
  const rect = box.getBoundingClientRect();
  const y = Math.max(0.02, Math.min(0.98, (e.clientY - rect.top) / rect.height));
  if (phase === 'down') { r.drag = Math.abs(y - r.y1) < Math.abs(y - r.y2) ? 1 : 2; }
  if (r.drag) { if (r.drag === 1) r.y1 = y; else r.y2 = y; rulerReadout(); }
  if (phase === 'up') r.drag = 0;
  e.preventDefault();
}
async function saveRuler() {
  const r = S.ruler; if (!r) return;
  const t = S.trees.find(x => x.id === r.id);
  const ft = rulerFeet(t.dist || (t.ai && t.ai.distance_m), r.y1, r.y2, r.portrait);
  if (t && ft) { t.heightMeasured = Math.round(ft); markDirty(t); try { await DB.putTree(stripRuntime(t)); } catch (e) {} toast(`${t.id} height set: ≈${Math.round(ft)} ft (on-photo ruler)`); }
  S.ruler = null; render();
}
