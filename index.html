/* ---------------- Site weather (Open-Meteo, no key) ---------------- */
async function loadWeather(force) {
  if (S.weather && !force && Date.now() - S.weather.at < 30*60000) return;
  const pt = S.trees.find(t => typeof t.lat === 'number') || (S.gpsWatch.ok ? { lat: S.gpsWatch.lat, lng: S.gpsWatch.lng } : null);
  if (!pt) { S.weather = { err: 'No site coordinates yet — log a tree or get a GPS fix first.', at: Date.now() }; render(); return; }
  S.weatherBusy = true; render();
  try {
    const u = `https://api.open-meteo.com/v1/forecast?latitude=${pt.lat.toFixed(4)}&longitude=${pt.lng.toFixed(4)}&current=temperature_2m,wind_speed_10m,wind_gusts_10m,precipitation&hourly=wind_gusts_10m,precipitation_probability,precipitation&forecast_days=2&wind_speed_unit=mph&temperature_unit=fahrenheit&timezone=auto`;
    const r = await fetch(u); if (!r.ok) throw new Error('weather ' + r.status);
    const d = await r.json();
    const g48 = Math.max(...(d.hourly.wind_gusts_10m || [0]).slice(0, 48));
    const p48 = Math.max(...(d.hourly.precipitation_probability || [0]).slice(0, 48));
    const rain48 = (d.hourly.precipitation || []).slice(0, 48).reduce((a, b) => a + (b || 0), 0);
    let risk, tone;
    if (g48 >= 40) { risk = 'Suspend aerial and crane work in the gust window. Saturated ground + gusts of this strength also raise fresh uprooting risk on already-leaning stems.'; tone = 'bad'; }
    else if (g48 >= 25) { risk = 'Caution aloft — expect gusts that move limbs. Prioritize High Hazard removals early in the day.'; tone = 'warn'; }
    else { risk = 'Workable conditions for climbing and aerial operations.'; tone = 'good'; }
    if (rain48 >= 25 && tone !== 'bad') { risk += ' Heavy rain expected — root plates in saturated soil hold less; re-check leaning stems after.'; tone = 'warn'; }
    S.weather = { at: Date.now(), temp: Math.round(d.current.temperature_2m), wind: Math.round(d.current.wind_speed_10m), gust: Math.round(d.current.wind_gusts_10m), g48: Math.round(g48), p48, rain48: Math.round(rain48 * 10) / 10 * 0.0393701, risk, tone, err: null };
  } catch (e) { S.weather = { err: 'Weather service unreachable — try again with signal.', at: Date.now() }; }
  S.weatherBusy = false; render();
}

/* ---------------- On-photo ruler ----------------
   Distance to trunk (from the AI) + lens field of view turn a pixel span
   into feet. tan-mapped, honest about being an estimate. */
function rulerFeet(distM, y1, y2, portrait) {
  if (!distM) return null;
  const fov = (portrait ? 64 : 48) * Math.PI / 180;   // FOV along the image's vertical axis
  const ang = y => (0.5 - y) * fov;
  const m = distM * (Math.tan(ang(Math.min(y1, y2))) - Math.tan(ang(Math.max(y1, y2))));
  return Math.abs(m) * 3.28084;
}
function openRuler(id) {
  const t = S.trees.find(x => x.id === id); if (!t) return;
  const d = t.dist || (t.ai && t.ai.distance_m);
  if (!d) { toast('No camera distance on this record — the ruler needs it'); return; }
  S.ruler = { id, y1: 0.22, y2: 0.86, portrait: true, drag: 0 };
  const im = new Image(); im.onload = () => { if (S.ruler) { S.ruler.portrait = im.height >= im.width; rulerReadout(); } }; im.src = t.photo;
  render();
}
function rulerReadout() {
  const r = S.ruler; if (!r) return;
  const t = S.trees.find(x => x.id === r.id); if (!t) return;
  const ft = rulerFeet(t.dist || (t.ai && t.ai.distance_m), r.y1, r.y2, r.portrait);
  const el = document.getElementById('rulerFt'); if (el) el.textContent = ft ? '≈ ' + Math.round(ft) + ' ft' : '—';
  const l1 = document.getElementById('rl1'), l2 = document.getElementById('rl2');
  if (l1) l1.style.top = (r.y1 * 100) + '%'; if (l2) l2.style.top = (r.y2 * 100) + '%';
}
function rulerPointer(e, phase) {
  const r = S.ruler; if (!r) return;
  const box = document.getElementById('rulerBox'); if (!box) return;
  const rect = box.getBoundingClientRect();
  const y = Math.max(0.02, Math.min(0.98, (e.clientY - rect.top) / rect.height));
  if (phase === 'down') { r.drag = Math.abs(y - r.y1) < Math.abs(y - r.y2) ? 1 : 2; }
  if (r.drag) { if (r.drag === 1) r.y1 = y; else r.y2 = y; rulerReadout(); }
  if (phase === 'up') r.drag = 0;
  e.preventDefault();
}
async function saveRuler() {
  const r = S.ruler; if (!r) return;
  const t = S.trees.find(x => x.id === r.id);
  const ft = rulerFeet(t.dist || (t.ai && t.ai.distance_m), r.y1, r.y2, r.portrait);
  if (t && ft) { t.heightMeasured = Math.round(ft); markDirty(t); try { await DB.putTree(stripRuntime(t)); } catch (e) {} toast(`${t.id} height set: ≈${Math.round(ft)} ft (on-photo ruler)`); }
  S.ruler = null; render();
}
function rulerView() {
  const r = S.ruler; const t = S.trees.find(x => x.id === r.id) || {};
  return `
  <div class="ruler">
    <div style="flex:none;padding:calc(env(safe-area-inset-top,0px) + 16px) 18px 10px;display:flex;justify-content:space-between;align-items:center;color:#fff">
      <div><div style="font-size:15px;font-weight:700">On-photo ruler · ${esc(r.id)}</div><div style="font-size:11.5px;color:#8a929b">Drag BASE to the trunk base, TOP to the crown tip</div></div>

      <button onclick="goHome()" aria-label="Trice — start screen" style="border:0;background:none;padding:0;display:flex;align-items:center;gap:11px;text-align:left;color:var(--ink)"><div class="logo"><span></span><span></span><span></span></div>

      ${IS_DESKTOP() ? `<button onclick="toggleAdmin()" style="flex:none;border:1px solid ${S.admin ? 'var(--accent)' : 'var(--line)'};background:${S.admin ? 'var(--accent)' : '#fff'};color:${S.admin ? '#fff' : 'var(--muted)'};border-radius:999px;padding:7px 14px;font-size:11px;font-weight:700;margin-right:10px">${S.admin ? 'Admin ✓' : 'Admin'}</button>` : ''}
      <div class="site">${S.site ? `<div class="s1">${esc(S.site)}</div><div class="s2">${(S.job && S.job.propCode) ? esc(S.job.propCode) + ' · ' : ''}${S.trees.filter(t => siteOfT(t) === S.site).length} assets</div>` : `<div class="s1" style="color:var(--muted)">No project joined</div><div class="s2">Join one on Survey</div>`}</div>
    </div>
    <div class="view">${body}</div>
    <div class="nav">${navBtn('survey','Survey')}${navBtn('map','Map')}${navBtn('trees','Register')}${navBtn('sheet','Sheet')}${navBtn('report','Report')}</div>
    ${S.ruler ? rulerView() : ''}
    ${S.showCheck ? checkSheet() : ''}
    ${S.camOpen ? camView() : ''}
    ${S.zoomSrc ? zoomView() : ''}
    ${adjT ? adjustSheet(adjT) : ''}
    ${S.projectId ? projectSheet(S.projectId) : ''}
    ${S.backups ? backupsSheet() : ''}`;
  if (S.tab === 'map' && !S.zoomSrc) requestAnimationFrame(mountMap);
}
const IS_DESKTOP = () => window.matchMedia && window.matchMedia('(min-width: 900px)').matches;
try { window.matchMedia('(min-width: 900px)').addEventListener('change', () => render()); } catch (e) { window.addEventListener('resize', () => { clearTimeout(window.__rzT); window.__rzT = setTimeout(render, 200); }); }
const ADMIN = () => S.admin && IS_DESKTOP();
function toggleAdmin() { S.admin = !S.admin; localStorage.setItem('trice_admin', S.admin ? '1' : '0'); toast(S.admin ? 'Admin mode — assessor filters & bulk tools unlocked on Register and Report' : 'Admin mode off'); render(); }
function goHome() { S.tab = 'survey'; S.detailId = null; S.editId = null; S.zoomSrc = null; S.showCheck = false; try { localStorage.setItem('trice_tab', 'survey'); } catch (e) {} render(); const v = document.querySelector('.view'); if (v) v.scrollTop = 0; }
function go(tab) { S.tab = tab; try { localStorage.setItem('trice_tab', tab); } catch (e) {} if (tab === 'report') loadWeather(); if (tab !== 'trees') { S.detailId = null; S.editId = null; } S.zoomSrc = null; render(); const v = document.querySelector('.view'); if (v) v.scrollTop = 0; }

/* ---- Boot (migrates v2/v3 records) ---- */
function migrate(t) {
  if (!t.hazard) {
    const r = t.ai && t.ai.risk;
    t.hazard = r === 'High' ? 'High Hazard' : (r === 'Low' ? 'Cleared' : 'Moderate');
  }
  if (t.qty == null) t.qty = 1;
  if (t.ip == null) t.ip = 'IP';
  if (t.mgd == null) t.mgd = 'No';
  if (t.zone == null) t.zone = t.loc || '';
  if (t.dbhIn == null && t.ai && t.ai.dbh) { const m = String(t.ai.dbh).match(/(\d+)/); if (m) t.dbhIn = parseInt(m[1], 10); }
  if (!t.cause) t.cause = t.ai && t.ai.storm_damage && !/^none/i.test(t.ai.storm_damage) ? 'Windthrow' : 'Undetermined';
  if (!t.failures) t.failures = [];
  return t;
}
(async function boot() {
  // v10: the API key lives server-side only — purge any key an older build stored on this phone.
  try { localStorage.removeItem('trice_api_key'); localStorage.removeItem('trice_prefix'); } catch (e) {}
  // Clean-slate epoch: this build starts everyone from scratch, once.
  const EPOCH = 'fresh-2026-08-12';
  if (localStorage.getItem('trice_epoch') !== EPOCH) {
    try { const old = await DB.allTrees(); for (const t of old) { try { await DB.delTree(t.id); } catch (e) {} } } catch (e) {}
    for (const k of ['trice_site','trice_joined','trice_projects','trice_surveyor','trice_job','trice_prefix','trice_tombs','trice_sync_last','trice_reset_seen','trice_ucolor','trice_lastBackup','trice_read','trice_tab']) localStorage.removeItem(k);
    try { await DB.setMeta('seq', 1); await DB.setMeta('draft', null); await DB.setMeta('lastArchive', null); } catch (e) {}
    /* Local clean-slate only — a device's first visit must NEVER reset the team store. */
    localStorage.setItem('trice_epoch', EPOCH);
    S.site = ''; S.surveyor = ''; S.job = {}; S.execRead = '';
  }
  try {
    S.trees = (await DB.allTrees()).map(migrate);
    S.trees.sort((a, b) => a.id < b.id ? -1 : 1);
    const seq = await DB.getMeta('seq');
    if (seq) S.seq = seq;
    else if (S.trees.length) S.seq = Math.max(...S.trees.map(t => parseInt((t.id.match(/(\d+)$/) || [0,0])[1], 10) || 0)) + 1;
  } catch (e) { console.error(e); }
  S.caps = loadCaps();
  // Migration: a site chosen in an older build becomes a project (listed, not auto-joined).
  if (S.site && !S.projects.includes(S.site)) { S.projects.push(S.site); try { localStorage.setItem('trice_projects', JSON.stringify(S.projects)); } catch (e) {} }
  if (S.site && !localStorage.getItem('trice_joined')) { S.site = ''; try { localStorage.removeItem('trice_site'); } catch (e) {} }
  try { const savedDraft = await DB.getMeta('draft'); if (savedDraft && savedDraft.photo) { S.draft = { ...savedDraft, analyzing: false }; S.tab = 'survey'; setTimeout(() => toast('Resumed your in-progress capture — nothing was lost'), 400); } } catch (e) {}
  if (!S.draft) { const lt = localStorage.getItem('trice_tab'); if (['survey','map','trees','report'].includes(lt)) S.tab = lt; }
  render();
  syncNow(); SYNC.timer = setInterval(syncNow, 25000);
  window.addEventListener('online', syncNow);
  // GPS only starts after the user has granted it once (readiness check / camera) — never a prompt on page load
  if (S.caps && S.caps.gps) startGPS();
})();
</script>
<script>
if ('serviceWorker' in navigator && location.protocol === 'https:') {
  navigator.serviceWorker.register('/sw.js').catch(function(){});
}
</script>
