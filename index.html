  const row = (inner, onclick, extra) => `<button onclick="${onclick}" style="display:flex;align-items:center;gap:10px;width:100%;background:none;border:0;padding:13px 16px;text-align:left;border-top:1px solid var(--hair);cursor:pointer;${extra || ''}">${inner}</button>`;
  return `
  <div onclick="S.hdrMenu=false;render()" style="position:fixed;inset:0;z-index:58;background:rgba(11,14,18,.18)"></div>
  <div style="position:absolute;top:calc(100% + 8px);right:12px;z-index:59;width:min(300px, calc(100vw - 24px));background:#fff;border:1px solid var(--line);border-radius:16px;box-shadow:0 18px 44px rgba(16,18,22,.16);overflow:hidden;animation:fadeUp .18s ease both">
    <div style="padding:14px 16px 12px">
      <div class="slab">Project</div>
      ${S.site ? `<div style="font-size:14.5px;font-weight:700;margin-top:4px">${esc(S.site)}</div><div style="font-size:11.5px;color:var(--muted);margin-top:2px">${j.propCode ? esc(j.propCode) + ' \u00b7 ' : ''}${assets} asset${assets === 1 ? '' : 's'}</div>` : `<div style="font-size:13.5px;font-weight:600;color:var(--muted);margin-top:4px">No project joined</div>`}
    </div>
    ${row(`<span style="flex:1;font-size:13px;font-weight:700;color:var(--info)">${S.site ? 'Switch project' : 'Join a project'}</span><span style="color:var(--faint)">\u203a</span>`, "S.hdrMenu=false;S.showPicker=true;render()")}
    ${row(`<span id="syncTop" style="flex:1;font-size:13px;font-weight:700"></span><span style="font-size:11px;color:var(--faint)">tap to sync</span>`, "manualSync()")}
    ${row(`<span style="flex:1;font-size:13px;font-weight:700">${esc(S.surveyor || 'No user')}</span><span style="font-size:11px;color:var(--info);font-weight:700">Switch user</span>`, "S.hdrMenu=false;switchUser()")}
    ${row(`<span style="flex:1;font-size:13px;font-weight:700;color:var(--bad)">Sign out</span>`, "S.hdrMenu=false;signOut()")}
  </div>`;
}
function goHome() { S.hdrMenu = false; S.tab = 'survey'; S.detailId = null; S.editId = null; S.zoomSrc = null; S.showCheck = false; try { localStorage.setItem('trice_tab', 'survey'); } catch (e) {} render(); const v = document.querySelector('.view'); if (v) v.scrollTop = 0; }
function go(tab) { S.hdrMenu = false; if (S.tab === 'sheet' && tab !== 'sheet') { const g = document.getElementById('gridScroll'); if (g) S.gridScrollY = g.scrollTop; const tw = document.getElementById('gridTableScroll'); if (tw) { S.gridTableY = tw.scrollTop; S.gridTableX = tw.scrollLeft; } } S.tab = tab; S.sheetSummary = false; S.gridFull = false; try { localStorage.setItem('trice_tab', tab); } catch (e) {} if (tab === 'report') loadWeather(); if (tab !== 'trees') { S.detailId = null; S.editId = null; } S.zoomSrc = null; render(); const v = document.querySelector('.view'); if (v) v.scrollTop = 0; }

/* ---- Always the newest build ----
   index.html is served no-cache and the service worker is network-first, but this is the
   belt-and-braces: compare the running build against the server on boot, on every foreground,
   and every 10 minutes. When a newer build is live: push any unsynced records first, purge
   every cache, and reload. IndexedDB and localStorage are never touched — records, drafts,
   projects and the team password all survive. An in-progress draft resumes after the reload. */
const BUILD = (document.querySelector('meta[name="version"]') || {}).content || '';
let VCHK_BUSY = false;
async function checkBuild(force) {
  if (VCHK_BUSY || !navigator.onLine || !gateOk() || document.visibilityState === 'hidden') return;
  if (Date.now() - (+(sessionStorage.getItem('trice_lastreload') || 0)) < 3 * 60 * 1000) return;
  const last = +(sessionStorage.getItem('trice_vchk') || 0);
  if (!force && Date.now() - last < 4 * 60 * 1000) return;
  try { sessionStorage.setItem('trice_vchk', String(Date.now())); } catch (e) {}
  let remote = '';
  try {
    const r = await fetch('/index.html?build=' + Date.now(), { cache: 'no-store' });
    if (!r.ok) return;
    const m = (await r.text()).match(/name="version" content="([^"]+)"/);
    remote = m ? m[1] : '';
  } catch (e) { return; }
  if (!remote || remote === BUILD) return;
  /* Newer build on the server. Never interrupt typing, an open camera, or a running analysis —
     try again in 30 seconds instead. */
  const ae = document.activeElement;
  if ((ae && /input|textarea|select/i.test(ae.tagName)) || S.camOpen || (S.draft && S.draft.analyzing)) { setTimeout(() => checkBuild(true), 30000); return; }
  VCHK_BUSY = true;
  toast('A newer build is live — updating this device…');
  try { await Promise.race([syncNow(), new Promise(res => setTimeout(res, 6000))]); } catch (e) {}
  try { const reg = navigator.serviceWorker && await navigator.serviceWorker.getRegistration(); if (reg) await reg.update(); } catch (e) {}
  try { const ks = await caches.keys(); await Promise.all(ks.map(k => caches.delete(k))); } catch (e) {}
  try { sessionStorage.setItem('trice_lastreload', String(Date.now())); } catch (e) {}
  setTimeout(() => location.reload(), 500);
}

/* ---- Boot (migrates v2/v3 records) ---- */
function migrate(t) {
  if (!t.hazard) {
    const r = t.ai && t.ai.risk;
    t.hazard = r === 'High' ? 'High Hazard' : (r === 'Low' ? 'Cleared' : 'Moderate');
  }
  if (t.qty == null) t.qty = 1;
  if (t.ip == null) t.ip = 'IP';
  if (t.mgd == null) t.mgd = 'No';
  if (t.zone == null) t.zone = t.loc || '';
  if (t.dbhIn == null && t.ai && t.ai.dbh) { const m = String(t.ai.dbh).match(/(\d+)/); if (m) t.dbhIn = parseInt(m[1], 10); }
  if (!t.cause) t.cause = t.ai && t.ai.storm_damage && !/^none/i.test(t.ai.storm_damage) ? 'Windthrow' : 'Undetermined';
  if (!t.failures) t.failures = [];
  return t;
}
(async function boot() {
  // v10: the API key lives server-side only — purge any key an older build stored on this phone.
  try { localStorage.removeItem('trice_api_key'); localStorage.removeItem('trice_prefix'); } catch (e) {}
  // Clean-slate epoch: this build starts everyone from scratch, once.
  const EPOCH = 'fresh-2026-08-12';
  if (localStorage.getItem('trice_epoch') !== EPOCH) {
    try { const old = await DB.allTrees(); for (const t of old) { try { await DB.delTree(t.id); } catch (e) {} } } catch (e) {}
    for (const k of ['trice_site','trice_joined','trice_projects','trice_surveyor','trice_job','trice_prefix','trice_tombs','trice_sync_last','trice_reset_seen','trice_ucolor','trice_lastBackup','trice_read','trice_tab']) localStorage.removeItem(k);
    try { await DB.setMeta('seq', 1); await DB.setMeta('draft', null); await DB.setMeta('lastArchive', null); } catch (e) {}
    /* Local clean-slate only — a device's first visit must NEVER reset the team store. */
    localStorage.setItem('trice_epoch', EPOCH);
    S.site = ''; S.surveyor = ''; S.job = {}; S.execRead = '';
  }
  try {
    S.trees = (await DB.allTrees()).map(migrate);
    for (const t of S.trees) { const nz = normZone(t.zone); if (t.zone && t.zone !== nz) { t.zone = nz; t.updated = Date.now(); t.dirty = true; try { DB.putTree(stripRuntime(t)); } catch (e) {} } }
    S.trees.sort((a, b) => a.id < b.id ? -1 : 1);
    const seq = await DB.getMeta('seq');
    if (seq) S.seq = seq;
    else if (S.trees.length) S.seq = Math.max(...S.trees.map(t => parseInt((t.id.match(/(\d+)$/) || [0,0])[1], 10) || 0)) + 1;
  } catch (e) { console.error(e); }
  S.caps = loadCaps();
  // Migration: a site chosen in an older build becomes a project (listed, not auto-joined).
  if (S.site && !S.projects.includes(S.site)) { S.projects.push(S.site); try { localStorage.setItem('trice_projects', JSON.stringify(S.projects)); } catch (e) {} }
  if (S.site && !localStorage.getItem('trice_joined')) { S.site = ''; try { localStorage.removeItem('trice_site'); } catch (e) {} }
  if (S.site && projHidden(S.site)) { S.site = ''; try { localStorage.removeItem('trice_site'); } catch (e) {} }
  try { const savedDraft = await DB.getMeta('draft'); if (savedDraft && savedDraft.photo) { S.draft = { ...savedDraft, analyzing: false }; S.tab = 'survey'; setTimeout(() => toast('Resumed your in-progress capture — nothing was lost'), 400); } } catch (e) {}
  if (!S.draft) { const lt = localStorage.getItem('trice_tab'); if (['survey','map','trees','sheet','report','projects'].includes(lt)) S.tab = lt; }
  render();
  syncNow(); SYNC.timer = setInterval(syncNow, 25000 + Math.floor(Math.random() * 12000));
  window.addEventListener('online', syncNow);
  /* Build watchdog — this device always runs what the server serves. */
  setTimeout(() => { try { loadExcelJS().catch(() => {}); } catch (e) {} }, 7000);
  setTimeout(() => checkBuild(true), 5000);
  setInterval(() => checkBuild(), 10 * 60 * 1000);
  document.addEventListener('visibilitychange', () => { if (document.visibilityState === 'visible') checkBuild(); });
  window.addEventListener('online', () => checkBuild());
  // GPS only starts after the user has granted it once (readiness check / camera) — never a prompt on page load
  if (S.caps && S.caps.gps) startGPS();
})();
</script>
<script>
if ('serviceWorker' in navigator && location.protocol === 'https:') {
  navigator.serviceWorker.register('/sw.js', { updateViaCache: 'none' }).then(function(reg){
    /* Ask for a newer build now, every 20 minutes, and every time the app
       returns to the foreground — field phones stay open for hours. */
    try { reg.update(); } catch(e){}
    setInterval(function(){ try { reg.update(); } catch(e){} }, 20*60*1000);
    document.addEventListener('visibilitychange', function(){
      if (document.visibilityState === 'visible') { try { reg.update(); } catch(e){} }
    });
  }).catch(function(){});
  /* NOTE: no reload on controllerchange. The build watchdog (checkBuild) is the
     single reload authority — two competing reload paths caused reload cascades
     (watchdog reload -> new SW claims -> controllerchange -> another reload). The
     new service worker simply takes over silently; the shell it serves is applied
     by the watchdog at a safe moment. */
}
